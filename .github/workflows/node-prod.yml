      version: ${{ steps.publish.outputs.version }}
      digest: ${{ steps.publish.outputs.digest }}
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Publish immutable image
        id: publish
        env:
          SERVICE_NAME: ${{ inputs.service-name }}
          DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          HEALTH_TIMEOUT: ${{ inputs.health-timeout }}
          PLATFORM: ${{ inputs.platform }}
          SERVICE_PROFILE: react
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          COMPOSE_SERVICE: ${{ vars.PROD2_COMPOSE_SERVICE }}
          CONTAINER_NAME: ${{ vars.PROD2_CONTAINER_NAME }}
          REMOTE_DIR: ${{ vars.PROD2_REMOTE_DIR }}
          HEALTH_URL: ${{ vars.PROD2_HEALTH_URL }}
          PROD_COMPOSE_FILE: ${{ vars.PROD2_COMPOSE_FILE }}
          DOCKERHUB_PUSH_TOKEN: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
          PROD2_HOST: ${{ secrets.PROD2_HOST }}
          PROD2_USER: ${{ secrets.PROD2_USER }}
          PROD2_SSH_PORT: ${{ secrets.PROD2_SSH_PORT }}
          PROD2_SSH_PRIVATE_KEY: ${{ secrets.PROD2_SSH_PRIVATE_KEY }}
          PROD2_HOST_FINGERPRINT: ${{ secrets.PROD2_HOST_FINGERPRINT }}
          PROD2_ENV_FILE: ${{ secrets.PROD2_ENV_FILE }}
        run: |
          node - publish <<'RELEASE_SCRIPT'
          'use strict';

          const {execFileSync, spawnSync} = require('node:child_process');

          const serviceProfiles = Object.freeze({
            gateway: 'base',
            batch: 'batch',
            community: 'community-redis',
            auth: 'auth-mysql',
            react: 'react',
          });
          const serviceRepositories = Object.freeze({
            gateway: 'devnogi/devnogi-gateway-server',
            batch: 'devnogi/open-api-batch-server',
            community: 'devnogi/devnogi-community-server',
            auth: 'devnogi/devnogi-auth-server',
            react: 'devnogi/devnogi-react',
          });
          const immutableVersionRules = Object.freeze(Object.keys(serviceProfiles).map(
            (service) => `^${service}-v[0-9]+\\.[0-9]+\\.[0-9]+$`,
          ));

          function required(env, key) {
            if (!env[key] || !env[key].trim()) throw Error(`Missing ${key}`);
            return env[key];
          }

          function validateInputs(env) {
            if (env.GITHUB_REF !== 'refs/heads/main' || !['push', 'workflow_dispatch'].includes(env.GITHUB_EVENT_NAME)) {
