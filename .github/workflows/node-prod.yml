name: Node production
on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      deployment-target:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      compose-file:
        required: true
        type: string
      health-timeout:
        required: true
        type: string
      platform:
        required: true
        type: string
      public-origin:
        required: true
        type: string
    secrets:
      DOCKERHUB_PUSH_TOKEN:
        required: true
      PROD2_HOST:
        required: true
      PROD2_USER:
        required: true
      PROD2_SSH_PORT:
        required: true
      PROD2_SSH_PRIVATE_KEY:
        required: true
      PROD2_HOST_FINGERPRINT:
        required: true
    outputs:
      version:
        value: ${{ jobs.publish.outputs.version }}
      digest:
        value: ${{ jobs.publish.outputs.digest }}
      tag:
        value: ${{ jobs.publish.outputs.tag }}
      commit:
        value: ${{ jobs.publish.outputs.commit }}
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Validate production request
        env:
          SERVICE_NAME: ${{ inputs.service-name }}
          DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          HEALTH_TIMEOUT: ${{ inputs.health-timeout }}
          PLATFORM: ${{ inputs.platform }}
          PUBLIC_ORIGIN: ${{ inputs.public-origin }}
          SERVICE_PROFILE: react
        run: |
          node - validate-inputs <<'RELEASE_SCRIPT'
          'use strict';

          const {execFileSync, spawnSync} = require('node:child_process');

          const serviceProfiles = Object.freeze({
            gateway: 'base',
            batch: 'batch',
            community: 'community-redis',
            auth: 'auth-mysql',
            react: 'react',
          });
          const serviceRepositories = Object.freeze({
            gateway: 'devnogi/devnogi-gateway-server',
            batch: 'devnogi/open-api-batch-server',
            community: 'devnogi/devnogi-community-server',
            auth: 'devnogi/devnogi-auth-server',
            react: 'devnogi/devnogi-react',
          });
          const immutableVersionRules = Object.freeze(Object.keys(serviceProfiles).map(
            (service) => `^${service}-v[0-9]+\\.[0-9]+\\.[0-9]+$`,
          ));

          function required(env, key) {
            if (!env[key] || !env[key].trim()) throw Error(`Missing ${key}`);
            return env[key];
          }

          function validateInputs(env) {
            if (env.GITHUB_REF !== 'refs/heads/main' || !['push', 'workflow_dispatch'].includes(env.GITHUB_EVENT_NAME)) {
              throw Error('Production requires a main push or dispatch');
            }
            if (!/^[a-f0-9]{40}$/.test(required(env, 'GITHUB_SHA'))) throw Error('Invalid commit');
            if (!/^https:\/\/github\.com$/.test(required(env, 'GITHUB_SERVER_URL'))) throw Error('Invalid GitHub server');
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(required(env, 'GITHUB_REPOSITORY'))) throw Error('Invalid caller repository');
            const service = required(env, 'SERVICE_NAME');
            const profile = required(env, 'SERVICE_PROFILE');
            if (required(env, 'DEPLOYMENT_TARGET') !== 'prod2') throw Error('Invalid deployment target');
            if (!Object.hasOwn(serviceProfiles, service) || serviceProfiles[service] !== profile) throw Error('Invalid service profile mapping');
            if (serviceRepositories[service] !== env.GITHUB_REPOSITORY) throw Error('Caller repository does not match service');
            if (service === 'react' && required(env, 'PUBLIC_ORIGIN') !== 'https://www.memonogi.com') throw Error('Invalid public origin');
            if (!/^[a-zA-Z0-9][a-zA-Z0-9._/-]*\.ya?ml$/.test(required(env, 'COMPOSE_FILE')) || env.COMPOSE_FILE.includes('..')) throw Error('Invalid compose path');
            if (!/^[a-zA-Z0-9][a-zA-Z0-9._/-]*$/.test(required(env, 'DOCKERFILE')) || env.DOCKERFILE.includes('..')) throw Error('Invalid Dockerfile path');
            if (!/^[1-9][0-9]{0,2}$/.test(required(env, 'HEALTH_TIMEOUT')) || +env.HEALTH_TIMEOUT > 600) throw Error('Invalid health timeout');
            if (required(env, 'PLATFORM') !== 'linux/amd64') throw Error('Invalid platform');
          }

          function validatePublishSecrets(env) {
            if (!/^[a-z0-9]+(?:[._-][a-z0-9]+)*$/.test(required(env, 'DOCKERHUB_USERNAME'))) throw Error('Invalid Docker Hub username');
            if (required(env, 'DOCKERHUB_REPOSITORY') !== 'devanted/memonogi') throw Error('Invalid Docker Hub repository');
            required(env, 'DOCKERHUB_PUSH_TOKEN');
          }

          function validateDeploymentSettings(env) {
            for (const key of ['COMPOSE_SERVICE', 'CONTAINER_NAME']) {
              if (!/^[a-zA-Z0-9][a-zA-Z0-9_.-]*$/.test(required(env, key))) throw Error(`Invalid ${key}`);
            }
            if (!/^\/(?:[a-zA-Z0-9_-]+\/)*[a-zA-Z0-9_-]+$/.test(required(env, 'REMOTE_DIR'))) throw Error('Invalid remote directory');
            if (!/^http:\/\/127\.0\.0\.1:[1-9][0-9]{0,4}\/[a-zA-Z0-9/_-]*$/.test(required(env, 'HEALTH_URL')) || +new URL(env.HEALTH_URL).port > 65535) throw Error('Invalid health URL');
            if (!/^[a-zA-Z0-9][a-zA-Z0-9._-]*\.ya?ml$/.test(required(env, 'PROD_COMPOSE_FILE'))) throw Error('Invalid production Compose filename');
          }

          function validateDeploymentSecrets(env) {
            if (!Object.values(serviceRepositories).includes(required(env, 'GITHUB_REPOSITORY'))) throw Error('Invalid deployment caller');
            if (!/^[a-zA-Z0-9][a-zA-Z0-9.-]*$/.test(required(env, 'PROD2_HOST'))) throw Error('Invalid production host');
            if (!/^[a-z_][a-z0-9_-]*$/.test(required(env, 'PROD2_USER'))) throw Error('Invalid production user');
            if (required(env, 'PROD2_SSH_PORT') !== '46232') throw Error('Invalid production SSH port');
            if (!/^SHA256:[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]$/.test(required(env, 'PROD2_HOST_FINGERPRINT'))) throw Error('Invalid production fingerprint');
            for (const key of ['PROD2_SSH_PRIVATE_KEY', 'PROD2_ENV_FILE']) required(env, key);
            if (/^\s*(?:export\s+)?IMAGE_REF\s*=/m.test(env.PROD2_ENV_FILE)) throw Error('PROD2_ENV_FILE must not set IMAGE_REF');
            if (env.SERVICE_NAME === 'react' && /^\s*(?:export\s+)?APP_REVISION\s*=/m.test(env.PROD2_ENV_FILE)) throw Error('PROD2_ENV_FILE must not set APP_REVISION');
          }

          function version(value, allowSnapshot = true) {
            const release = allowSnapshot ? value.trim().replace(/-SNAPSHOT$/, '') : value.trim();
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(release)) throw Error('Invalid release version');
            return release;
          }

          function collision(versionDigest) {
            if (versionDigest === null) return 'build';
            if (/^sha256:[a-f0-9]{64}$/.test(versionDigest)) return 'verify-reuse';
            throw Error('Invalid existing tag digest');
          }

          function verifyArtifactRevision(currentSha, artifactRevision, deps = {}) {
            if (!/^[a-f0-9]{40}$/.test(artifactRevision)) throw Error('Invalid existing image revision');
            if (artifactRevision === currentSha) return artifactRevision;
            const git = deps.gitExecFileSync || execFileSync;
            try {
              git('git', ['merge-base', '--is-ancestor', artifactRevision, currentSha], {stdio: 'ignore'});
            } catch {
              throw Error('Existing image revision is not an ancestor of this commit');
            }
            let commits;
            try {
              commits = git('git', ['rev-list', '--reverse', `${artifactRevision}..${currentSha}`], {encoding: 'utf8'}).trim().split(/\r?\n/).filter(Boolean);
            } catch {
              throw Error('Cannot enumerate existing image recovery commits');
            }
            const allowed = (file) => file.startsWith('.github/workflows/') || file === 'scripts/workflow-contract.test.mjs';
            const normalizePins = (file, contents) => {
              if (file === 'scripts/workflow-contract.test.mjs') {
                return contents.replace(/(const pin = ')[a-f0-9]{40}(';)/g, '$1<sha>$2');
              }
              return contents.replace(/(devnogi\/ci-workflows\/\.github\/workflows\/(?:spring|node)-(?:ci|prod)\.yml@)[a-f0-9]{40}/g, '$1<sha>');
            };
            let changed = false;
            for (const commit of commits) {
              let parent;
              let paths;
              try {
                parent = git('git', ['rev-parse', `${commit}^1`], {encoding: 'utf8'}).trim();
                paths = git('git', ['diff', '--name-only', '-z', '--no-renames', parent, commit, '--'], {encoding: 'utf8'}).split(String.fromCharCode(0)).filter(Boolean);
              } catch {
                throw Error('Cannot verify deployment workflow pin changes');
              }
              if (paths.length === 0) continue;
              changed = true;
              if (paths.some((file) => !allowed(file))) throw Error('Existing image revision differs outside deployment workflow files');
              for (const file of paths) {
                let before;
                let after;
                try {
                  before = git('git', ['show', `${parent}:${file}`], {encoding: 'utf8'});
                  after = git('git', ['show', `${commit}:${file}`], {encoding: 'utf8'});
                } catch {
                  throw Error('Existing image recovery cannot add, delete, or rename caller files');
                }
                if (before === after || normalizePins(file, before) !== normalizePins(file, after)) {
                  throw Error('Existing image recovery may change only in-place shared workflow SHAs');
                }
              }
            }
            if (!changed) throw Error('Existing image recovery contains no workflow pin change');
            return artifactRevision;
          }

          function releaseCommit(env) {
            const commit = required(env, 'RELEASE_COMMIT').trim();
            if (!/^[a-f0-9]{40}$/.test(commit)) throw Error('Invalid release commit');
            return commit;
          }

          function immutableTagsRequired(info, tags) {
            if (!info || info.is_private !== true) throw Error('Private Docker Hub repository required');
            const settings = info.immutable_tags_settings;
            if (!settings || settings.enabled !== true || !Array.isArray(settings.rules)) throw Error('Docker Hub immutable tags are required');
            if (settings.rules.length === 0) return;
            if (!Array.isArray(tags) || tags.length !== 1) throw Error('Published tag is required for immutable-rule validation');
            if (!/^(?:gateway|batch|community|auth|react)-v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tags[0])) {
              throw Error('Unexpected published tag format');
            }
            const allTags = settings.rules.includes('.*') || settings.rules.includes('^.*$');
            if (!allTags && !immutableVersionRules.every((rule) => settings.rules.includes(rule))) {
              throw Error('Use all-tag immutability or every documented service version rule');
            }
          }

          function resolveGradleVersion(env, deps = {}) {
            const gradle = deps.execFileSync || execFileSync;
            const fs = deps.fs || require('node:fs');
            let output;
            try {
              output = gradle('./gradlew', ['properties', '-q'], {encoding: 'utf8'});
            } catch {
              throw Error('Gradle version resolution failed');
            }
            const matches = [...output.matchAll(/^version:\s*(.+)$/gm)];
            if (matches.length !== 1) throw Error('Cannot resolve root Gradle version');
            const release = version(matches[0][1]);
            fs.appendFileSync(env.GITHUB_OUTPUT, `version=${release}\n`);
            return release;
          }

          function resolveNpmVersion(env, deps = {}) {
            const fs = deps.fs || require('node:fs');
            let parsed;
            try {
              parsed = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            } catch {
              throw Error('Cannot read package version');
            }
            const release = version(String(parsed.version || ''), false);
            fs.appendFileSync(env.GITHUB_OUTPUT, `version=${release}\n`);
            return release;
          }

          async function hub(path, token, request) {
            const response = await request(`https://hub.docker.com/v2/${path}`, {
              headers: {Authorization: `Bearer ${token}`},
              signal: AbortSignal.timeout(30000),
            });
            if (response.status === 404) return null;
            if (!response.ok) throw Error(`Docker Hub request failed (${response.status})`);
            return response.json();
          }

          function command(name, args) {
            try {
              execFileSync(name, args, {stdio: 'ignore'});
            } catch {
              throw Error('Docker command failed');
            }
          }

          function capture(name, args) {
            try {
              return execFileSync(name, args, {encoding: 'utf8'}).trim();
            } catch {
              throw Error('Docker inspection failed');
            }
          }

          async function publish(env, deps = {}) {
            validateInputs(env);
            validatePublishSecrets(env);
            validateDeploymentSettings(env);
            validateDeploymentSecrets(env);
            const request = deps.fetch || fetch;
            const run = deps.cmd || command;
            const inspect = deps.capture || capture;
            const login = deps.spawnSync || spawnSync;
            const fs = deps.fs || require('node:fs');
            const release = version(required(env, 'RELEASE_VERSION'));
            const sha = env.GITHUB_SHA;
            const service = env.SERVICE_NAME;
            const username = env.DOCKERHUB_USERNAME;
            const image = env.DOCKERHUB_REPOSITORY;
            const [namespace, repository] = image.split('/');
            const versionTag = `${service}-v${release}`;

            const auth = await request('https://hub.docker.com/v2/auth/token', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({identifier: username, secret: env.DOCKERHUB_PUSH_TOKEN}),
              signal: AbortSignal.timeout(30000),
            });
            if (!auth.ok) throw Error(`Docker Hub authentication failed (${auth.status})`);
            const token = (await auth.json()).access_token;
            if (!token) throw Error('Docker Hub token missing');

            const info = await hub(`namespaces/${namespace}/repositories/${repository}`, token, request);
            immutableTagsRequired(info, [versionTag]);
            const readDigest = async (tag) => {
              const tagInfo = await hub(`namespaces/${namespace}/repositories/${repository}/tags/${tag}`, token, request);
              return tagInfo ? tagInfo.digest : null;
            };

            let versionDigest = await readDigest(versionTag);
            const state = collision(versionDigest);
            let digest;
            let artifactRevision = sha;
            const loginResult = login('docker', ['login', '--username', username, '--password-stdin'], {
              input: env.DOCKERHUB_PUSH_TOKEN,
              stdio: ['pipe', 'ignore', 'pipe'],
            });
            if (loginResult.status !== 0) throw Error('Docker login failed');

            if (state === 'verify-reuse') {
              run('docker', ['pull', `${image}:${versionTag}`]);
              const revision = inspect('docker', ['image', 'inspect', '--format', '{{ index .Config.Labels "org.opencontainers.image.revision" }}', `${image}:${versionTag}`]);
              const imageVersion = inspect('docker', ['image', 'inspect', '--format', '{{ index .Config.Labels "org.opencontainers.image.version" }}', `${image}:${versionTag}`]);
              const source = inspect('docker', ['image', 'inspect', '--format', '{{ index .Config.Labels "org.opencontainers.image.source" }}', `${image}:${versionTag}`]);
              const repoDigests = JSON.parse(inspect('docker', ['image', 'inspect', '--format', '{{json .RepoDigests}}', `${image}:${versionTag}`]));
              if (imageVersion !== release || source !== `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}` || !repoDigests.includes(`${image}@${versionDigest}`)) {
                throw Error('Existing tag does not match this commit and version');
              }
              artifactRevision = verifyArtifactRevision(sha, revision, deps);
              digest = versionDigest;
            } else {
              if (await readDigest(versionTag) !== null) throw Error('Tag appeared before publication');

              const metadataFile = `${env.RUNNER_TEMP}/build-metadata.json`;
              run('docker', [
                'buildx', 'build', '--push',
                '--platform', env.PLATFORM,
                '--file', env.DOCKERFILE,
                '--tag', `${image}:${versionTag}`,
                '--label', `org.opencontainers.image.revision=${sha}`,
                '--label', `org.opencontainers.image.source=${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}`,
                '--label', `org.opencontainers.image.version=${release}`,
                ...(service === 'react' ? ['--build-arg', `APP_REVISION=${sha}`] : []),
                '--metadata-file', metadataFile,
                '.',
              ]);
              let metadata;
              try {
                metadata = JSON.parse(fs.readFileSync(metadataFile, 'utf8'));
              } catch {
                throw Error('Buildx metadata unavailable');
              }
              digest = metadata['containerimage.digest'];
              if (!/^sha256:[a-f0-9]{64}$/.test(digest || '')) throw Error('Buildx digest unavailable');
              versionDigest = await readDigest(versionTag);
              if (versionDigest !== digest) throw Error('Registry digest does not match Buildx output');
            }

            fs.appendFileSync(env.GITHUB_OUTPUT, `version=${release}\ndigest=${digest}\ntag=${versionTag}\ncommit=${artifactRevision}\n`);
            fs.appendFileSync(env.GITHUB_STEP_SUMMARY, `Service: ${service}\n\nVersion: ${release}\n\nTag: ${versionTag}\n\nArtifact commit: ${artifactRevision}\n\nWorkflow commit: ${sha}\n\nDigest: ${digest}\n`);
          }

          function releaseBody(env) {
            const service = required(env, 'SERVICE_NAME');
            const release = version(required(env, 'RELEASE_VERSION'), false);
            const sha = releaseCommit(env);
            const digest = required(env, 'IMAGE_DIGEST');
            const image = required(env, 'DOCKERHUB_REPOSITORY');
            const tag = `${service}-v${release}`;
            const workflowSha = required(env, 'GITHUB_SHA');
            if (!/^sha256:[a-f0-9]{64}$/.test(digest)) throw Error('Invalid image digest');
            return [
              `Service: ${service}`,
              `Version: ${release}`,
              `Artifact commit: ${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/commit/${sha}`,
              `Deployment workflow commit: ${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/commit/${workflowSha}`,
              `Image: ${image}@${digest}`,
              `Docker tag: ${image}:${tag}`,
            ].join('\n\n');
          }

          async function githubRelease(env, deps = {}) {
            validateInputs(env);
            const request = deps.fetch || fetch;
            const fs = deps.fs || require('node:fs');
            const token = required(env, 'GITHUB_TOKEN');
            const service = env.SERVICE_NAME;
            const release = version(required(env, 'RELEASE_VERSION'), false);
            const tag = `${service}-v${release}`;
            const tagCommit = required(env, 'GITHUB_SHA');
            const body = releaseBody(env);
            const api = required(env, 'GITHUB_API_URL');
            if (api !== 'https://api.github.com') throw Error('Invalid GitHub API URL');
            const base = `${api}/repos/${env.GITHUB_REPOSITORY}`;
            const call = async (path, options = {}) => {
              const response = await request(`${base}${path}`, {
                ...options,
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${token}`,
                  'X-GitHub-Api-Version': '2022-11-28',
                  ...(options.headers || {}),
                },
                signal: AbortSignal.timeout(30000),
              });
              if (response.status === 404) return null;
              if (!response.ok) throw Error(`GitHub Release request failed (${response.status})`);
              return response.json();
            };
            const resolveTag = async () => {
              const ref = await call(`/git/ref/tags/${encodeURIComponent(tag)}`);
              if (!ref) return null;
              let object = ref.object;
              for (let depth = 0; depth < 5 && object.type === 'tag'; depth += 1) {
                const annotated = await call(`/git/tags/${object.sha}`);
                if (!annotated) throw Error('Annotated tag object missing');
                object = annotated.object;
              }
              if (object.type !== 'commit' || !/^[a-f0-9]{40}$/.test(object.sha)) throw Error('Release tag does not resolve to a commit');
              return object.sha;
            };
            const verifyTagCommit = async (commit) => {
              if (commit === tagCommit) return;
              const comparison = await call(`/compare/${tagCommit}...${commit}`);
              if (!comparison || comparison.status !== 'ahead' || comparison.merge_base_commit?.sha !== tagCommit) {
                throw Error('Release tag is not the deployment commit or its descendant');
              }
            };
            const verify = async (existing) => {
              const commit = await resolveTag();
              await verifyTagCommit(commit);
              if (!existing || existing.tag_name !== tag || existing.name !== tag || existing.body !== body || existing.draft || existing.prerelease) {
                throw Error('Existing GitHub Release does not match deployed metadata');
              }
              return existing;
            };

            let existing = await call(`/releases/tags/${encodeURIComponent(tag)}`);
            if (existing) {
              existing = await verify(existing);
            } else {
              const commit = await resolveTag();
              if (commit) await verifyTagCommit(commit);
              existing = await call('/releases', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                  tag_name: tag,
                  target_commitish: 'main',
                  name: tag,
                  body,
                  draft: false,
                  prerelease: false,
                  generate_release_notes: false,
                  make_latest: 'true',
                }),
              });
              if (!existing) throw Error('GitHub Release creation returned no result');
              existing = await verify(existing);
            }
            fs.appendFileSync(env.GITHUB_STEP_SUMMARY, `Release: ${existing.html_url}\n`);
            return existing;
          }

          module.exports = {collision, githubRelease, immutableTagsRequired, publish, releaseBody, releaseCommit, resolveGradleVersion, resolveNpmVersion, validateDeploymentSecrets, validateDeploymentSettings, validateInputs, validatePublishSecrets, verifyArtifactRevision, version};

          if (require.main === module || process.argv[1] === '-') {
            const mode = process.argv[2];
            Promise.resolve()
              .then(() => {
                if (mode === 'validate-inputs') return validateInputs(process.env);
                if (mode === 'resolve-gradle-version') return resolveGradleVersion(process.env);
                if (mode === 'resolve-npm-version') return resolveNpmVersion(process.env);
                if (mode === 'publish') return publish(process.env);
                if (mode === 'github-release') return githubRelease(process.env);
                throw Error('Invalid mode');
              })
              .catch((error) => {
                console.error(error.message);
                process.exitCode = 1;
              });
          }
          RELEASE_SCRIPT
  release-version:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - name: Resolve release version
        id: version
        run: |
          node - resolve-npm-version <<'RELEASE_SCRIPT'
          'use strict';

          const {execFileSync, spawnSync} = require('node:child_process');

          const serviceProfiles = Object.freeze({
            gateway: 'base',
            batch: 'batch',
            community: 'community-redis',
            auth: 'auth-mysql',
            react: 'react',
          });
          const serviceRepositories = Object.freeze({
            gateway: 'devnogi/devnogi-gateway-server',
            batch: 'devnogi/open-api-batch-server',
            community: 'devnogi/devnogi-community-server',
            auth: 'devnogi/devnogi-auth-server',
            react: 'devnogi/devnogi-react',
          });
          const immutableVersionRules = Object.freeze(Object.keys(serviceProfiles).map(
            (service) => `^${service}-v[0-9]+\\.[0-9]+\\.[0-9]+$`,
          ));

          function required(env, key) {
            if (!env[key] || !env[key].trim()) throw Error(`Missing ${key}`);
            return env[key];
          }

          function validateInputs(env) {
            if (env.GITHUB_REF !== 'refs/heads/main' || !['push', 'workflow_dispatch'].includes(env.GITHUB_EVENT_NAME)) {
              throw Error('Production requires a main push or dispatch');
            }
            if (!/^[a-f0-9]{40}$/.test(required(env, 'GITHUB_SHA'))) throw Error('Invalid commit');
            if (!/^https:\/\/github\.com$/.test(required(env, 'GITHUB_SERVER_URL'))) throw Error('Invalid GitHub server');
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(required(env, 'GITHUB_REPOSITORY'))) throw Error('Invalid caller repository');
            const service = required(env, 'SERVICE_NAME');
            const profile = required(env, 'SERVICE_PROFILE');
            if (required(env, 'DEPLOYMENT_TARGET') !== 'prod2') throw Error('Invalid deployment target');
            if (!Object.hasOwn(serviceProfiles, service) || serviceProfiles[service] !== profile) throw Error('Invalid service profile mapping');
            if (serviceRepositories[service] !== env.GITHUB_REPOSITORY) throw Error('Caller repository does not match service');
            if (service === 'react' && required(env, 'PUBLIC_ORIGIN') !== 'https://www.memonogi.com') throw Error('Invalid public origin');
            if (!/^[a-zA-Z0-9][a-zA-Z0-9._/-]*\.ya?ml$/.test(required(env, 'COMPOSE_FILE')) || env.COMPOSE_FILE.includes('..')) throw Error('Invalid compose path');
            if (!/^[a-zA-Z0-9][a-zA-Z0-9._/-]*$/.test(required(env, 'DOCKERFILE')) || env.DOCKERFILE.includes('..')) throw Error('Invalid Dockerfile path');
            if (!/^[1-9][0-9]{0,2}$/.test(required(env, 'HEALTH_TIMEOUT')) || +env.HEALTH_TIMEOUT > 600) throw Error('Invalid health timeout');
            if (required(env, 'PLATFORM') !== 'linux/amd64') throw Error('Invalid platform');
          }

          function validatePublishSecrets(env) {
            if (!/^[a-z0-9]+(?:[._-][a-z0-9]+)*$/.test(required(env, 'DOCKERHUB_USERNAME'))) throw Error('Invalid Docker Hub username');
            if (required(env, 'DOCKERHUB_REPOSITORY') !== 'devanted/memonogi') throw Error('Invalid Docker Hub repository');
            required(env, 'DOCKERHUB_PUSH_TOKEN');
          }

          function validateDeploymentSettings(env) {
            for (const key of ['COMPOSE_SERVICE', 'CONTAINER_NAME']) {
              if (!/^[a-zA-Z0-9][a-zA-Z0-9_.-]*$/.test(required(env, key))) throw Error(`Invalid ${key}`);
            }
            if (!/^\/(?:[a-zA-Z0-9_-]+\/)*[a-zA-Z0-9_-]+$/.test(required(env, 'REMOTE_DIR'))) throw Error('Invalid remote directory');
            if (!/^http:\/\/127\.0\.0\.1:[1-9][0-9]{0,4}\/[a-zA-Z0-9/_-]*$/.test(required(env, 'HEALTH_URL')) || +new URL(env.HEALTH_URL).port > 65535) throw Error('Invalid health URL');
            if (!/^[a-zA-Z0-9][a-zA-Z0-9._-]*\.ya?ml$/.test(required(env, 'PROD_COMPOSE_FILE'))) throw Error('Invalid production Compose filename');
          }

          function validateDeploymentSecrets(env) {
            if (!Object.values(serviceRepositories).includes(required(env, 'GITHUB_REPOSITORY'))) throw Error('Invalid deployment caller');
            if (!/^[a-zA-Z0-9][a-zA-Z0-9.-]*$/.test(required(env, 'PROD2_HOST'))) throw Error('Invalid production host');
            if (!/^[a-z_][a-z0-9_-]*$/.test(required(env, 'PROD2_USER'))) throw Error('Invalid production user');
            if (required(env, 'PROD2_SSH_PORT') !== '46232') throw Error('Invalid production SSH port');
            if (!/^SHA256:[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]$/.test(required(env, 'PROD2_HOST_FINGERPRINT'))) throw Error('Invalid production fingerprint');
            for (const key of ['PROD2_SSH_PRIVATE_KEY', 'PROD2_ENV_FILE']) required(env, key);
            if (/^\s*(?:export\s+)?IMAGE_REF\s*=/m.test(env.PROD2_ENV_FILE)) throw Error('PROD2_ENV_FILE must not set IMAGE_REF');
            if (env.SERVICE_NAME === 'react' && /^\s*(?:export\s+)?APP_REVISION\s*=/m.test(env.PROD2_ENV_FILE)) throw Error('PROD2_ENV_FILE must not set APP_REVISION');
          }

          function version(value, allowSnapshot = true) {
            const release = allowSnapshot ? value.trim().replace(/-SNAPSHOT$/, '') : value.trim();
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(release)) throw Error('Invalid release version');
            return release;
          }

          function collision(versionDigest) {
            if (versionDigest === null) return 'build';
            if (/^sha256:[a-f0-9]{64}$/.test(versionDigest)) return 'verify-reuse';
            throw Error('Invalid existing tag digest');
          }

          function verifyArtifactRevision(currentSha, artifactRevision, deps = {}) {
            if (!/^[a-f0-9]{40}$/.test(artifactRevision)) throw Error('Invalid existing image revision');
            if (artifactRevision === currentSha) return artifactRevision;
            const git = deps.gitExecFileSync || execFileSync;
            try {
              git('git', ['merge-base', '--is-ancestor', artifactRevision, currentSha], {stdio: 'ignore'});
            } catch {
              throw Error('Existing image revision is not an ancestor of this commit');
            }
            let commits;
            try {
              commits = git('git', ['rev-list', '--reverse', `${artifactRevision}..${currentSha}`], {encoding: 'utf8'}).trim().split(/\r?\n/).filter(Boolean);
            } catch {
              throw Error('Cannot enumerate existing image recovery commits');
            }
            const allowed = (file) => file.startsWith('.github/workflows/') || file === 'scripts/workflow-contract.test.mjs';
            const normalizePins = (file, contents) => {
              if (file === 'scripts/workflow-contract.test.mjs') {
                return contents.replace(/(const pin = ')[a-f0-9]{40}(';)/g, '$1<sha>$2');
              }
              return contents.replace(/(devnogi\/ci-workflows\/\.github\/workflows\/(?:spring|node)-(?:ci|prod)\.yml@)[a-f0-9]{40}/g, '$1<sha>');
            };
            let changed = false;
            for (const commit of commits) {
              let parent;
              let paths;
              try {
                parent = git('git', ['rev-parse', `${commit}^1`], {encoding: 'utf8'}).trim();
                paths = git('git', ['diff', '--name-only', '-z', '--no-renames', parent, commit, '--'], {encoding: 'utf8'}).split(String.fromCharCode(0)).filter(Boolean);
              } catch {
                throw Error('Cannot verify deployment workflow pin changes');
              }
              if (paths.length === 0) continue;
              changed = true;
              if (paths.some((file) => !allowed(file))) throw Error('Existing image revision differs outside deployment workflow files');
              for (const file of paths) {
                let before;
                let after;
                try {
                  before = git('git', ['show', `${parent}:${file}`], {encoding: 'utf8'});
                  after = git('git', ['show', `${commit}:${file}`], {encoding: 'utf8'});
                } catch {
                  throw Error('Existing image recovery cannot add, delete, or rename caller files');
                }
                if (before === after || normalizePins(file, before) !== normalizePins(file, after)) {
                  throw Error('Existing image recovery may change only in-place shared workflow SHAs');
                }
              }
            }
            if (!changed) throw Error('Existing image recovery contains no workflow pin change');
            return artifactRevision;
          }

          function releaseCommit(env) {
            const commit = required(env, 'RELEASE_COMMIT').trim();
            if (!/^[a-f0-9]{40}$/.test(commit)) throw Error('Invalid release commit');
            return commit;
          }

          function immutableTagsRequired(info, tags) {
            if (!info || info.is_private !== true) throw Error('Private Docker Hub repository required');
            const settings = info.immutable_tags_settings;
            if (!settings || settings.enabled !== true || !Array.isArray(settings.rules)) throw Error('Docker Hub immutable tags are required');
            if (settings.rules.length === 0) return;
            if (!Array.isArray(tags) || tags.length !== 1) throw Error('Published tag is required for immutable-rule validation');
            if (!/^(?:gateway|batch|community|auth|react)-v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tags[0])) {
              throw Error('Unexpected published tag format');
            }
            const allTags = settings.rules.includes('.*') || settings.rules.includes('^.*$');
            if (!allTags && !immutableVersionRules.every((rule) => settings.rules.includes(rule))) {
              throw Error('Use all-tag immutability or every documented service version rule');
            }
          }

          function resolveGradleVersion(env, deps = {}) {
            const gradle = deps.execFileSync || execFileSync;
            const fs = deps.fs || require('node:fs');
            let output;
            try {
              output = gradle('./gradlew', ['properties', '-q'], {encoding: 'utf8'});
            } catch {
              throw Error('Gradle version resolution failed');
            }
            const matches = [...output.matchAll(/^version:\s*(.+)$/gm)];
            if (matches.length !== 1) throw Error('Cannot resolve root Gradle version');
            const release = version(matches[0][1]);
            fs.appendFileSync(env.GITHUB_OUTPUT, `version=${release}\n`);
            return release;
          }

          function resolveNpmVersion(env, deps = {}) {
            const fs = deps.fs || require('node:fs');
            let parsed;
            try {
              parsed = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            } catch {
              throw Error('Cannot read package version');
            }
            const release = version(String(parsed.version || ''), false);
            fs.appendFileSync(env.GITHUB_OUTPUT, `version=${release}\n`);
            return release;
          }

          async function hub(path, token, request) {
            const response = await request(`https://hub.docker.com/v2/${path}`, {
              headers: {Authorization: `Bearer ${token}`},
              signal: AbortSignal.timeout(30000),
            });
            if (response.status === 404) return null;
            if (!response.ok) throw Error(`Docker Hub request failed (${response.status})`);
            return response.json();
          }

          function command(name, args) {
            try {
              execFileSync(name, args, {stdio: 'ignore'});
            } catch {
              throw Error('Docker command failed');
            }
          }

          function capture(name, args) {
            try {
              return execFileSync(name, args, {encoding: 'utf8'}).trim();
            } catch {
              throw Error('Docker inspection failed');
            }
          }

          async function publish(env, deps = {}) {
            validateInputs(env);
            validatePublishSecrets(env);
            validateDeploymentSettings(env);
            validateDeploymentSecrets(env);
            const request = deps.fetch || fetch;
            const run = deps.cmd || command;
            const inspect = deps.capture || capture;
            const login = deps.spawnSync || spawnSync;
            const fs = deps.fs || require('node:fs');
            const release = version(required(env, 'RELEASE_VERSION'));
            const sha = env.GITHUB_SHA;
            const service = env.SERVICE_NAME;
            const username = env.DOCKERHUB_USERNAME;
            const image = env.DOCKERHUB_REPOSITORY;
            const [namespace, repository] = image.split('/');
            const versionTag = `${service}-v${release}`;

            const auth = await request('https://hub.docker.com/v2/auth/token', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({identifier: username, secret: env.DOCKERHUB_PUSH_TOKEN}),
              signal: AbortSignal.timeout(30000),
            });
            if (!auth.ok) throw Error(`Docker Hub authentication failed (${auth.status})`);
            const token = (await auth.json()).access_token;
            if (!token) throw Error('Docker Hub token missing');

            const info = await hub(`namespaces/${namespace}/repositories/${repository}`, token, request);
            immutableTagsRequired(info, [versionTag]);
            const readDigest = async (tag) => {
              const tagInfo = await hub(`namespaces/${namespace}/repositories/${repository}/tags/${tag}`, token, request);
              return tagInfo ? tagInfo.digest : null;
            };

            let versionDigest = await readDigest(versionTag);
            const state = collision(versionDigest);
            let digest;
            let artifactRevision = sha;
            const loginResult = login('docker', ['login', '--username', username, '--password-stdin'], {
              input: env.DOCKERHUB_PUSH_TOKEN,
              stdio: ['pipe', 'ignore', 'pipe'],
            });
            if (loginResult.status !== 0) throw Error('Docker login failed');

            if (state === 'verify-reuse') {
              run('docker', ['pull', `${image}:${versionTag}`]);
              const revision = inspect('docker', ['image', 'inspect', '--format', '{{ index .Config.Labels "org.opencontainers.image.revision" }}', `${image}:${versionTag}`]);
              const imageVersion = inspect('docker', ['image', 'inspect', '--format', '{{ index .Config.Labels "org.opencontainers.image.version" }}', `${image}:${versionTag}`]);
              const source = inspect('docker', ['image', 'inspect', '--format', '{{ index .Config.Labels "org.opencontainers.image.source" }}', `${image}:${versionTag}`]);
              const repoDigests = JSON.parse(inspect('docker', ['image', 'inspect', '--format', '{{json .RepoDigests}}', `${image}:${versionTag}`]));
              if (imageVersion !== release || source !== `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}` || !repoDigests.includes(`${image}@${versionDigest}`)) {
                throw Error('Existing tag does not match this commit and version');
              }
              artifactRevision = verifyArtifactRevision(sha, revision, deps);
              digest = versionDigest;
            } else {
              if (await readDigest(versionTag) !== null) throw Error('Tag appeared before publication');

              const metadataFile = `${env.RUNNER_TEMP}/build-metadata.json`;
              run('docker', [
                'buildx', 'build', '--push',
                '--platform', env.PLATFORM,
                '--file', env.DOCKERFILE,
                '--tag', `${image}:${versionTag}`,
                '--label', `org.opencontainers.image.revision=${sha}`,
                '--label', `org.opencontainers.image.source=${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}`,
                '--label', `org.opencontainers.image.version=${release}`,
                ...(service === 'react' ? ['--build-arg', `APP_REVISION=${sha}`] : []),
                '--metadata-file', metadataFile,
                '.',
              ]);
              let metadata;
              try {
                metadata = JSON.parse(fs.readFileSync(metadataFile, 'utf8'));
              } catch {
                throw Error('Buildx metadata unavailable');
              }
              digest = metadata['containerimage.digest'];
              if (!/^sha256:[a-f0-9]{64}$/.test(digest || '')) throw Error('Buildx digest unavailable');
              versionDigest = await readDigest(versionTag);
              if (versionDigest !== digest) throw Error('Registry digest does not match Buildx output');
            }

            fs.appendFileSync(env.GITHUB_OUTPUT, `version=${release}\ndigest=${digest}\ntag=${versionTag}\ncommit=${artifactRevision}\n`);
            fs.appendFileSync(env.GITHUB_STEP_SUMMARY, `Service: ${service}\n\nVersion: ${release}\n\nTag: ${versionTag}\n\nArtifact commit: ${artifactRevision}\n\nWorkflow commit: ${sha}\n\nDigest: ${digest}\n`);
          }

          function releaseBody(env) {
            const service = required(env, 'SERVICE_NAME');
            const release = version(required(env, 'RELEASE_VERSION'), false);
            const sha = releaseCommit(env);
            const digest = required(env, 'IMAGE_DIGEST');
            const image = required(env, 'DOCKERHUB_REPOSITORY');
            const tag = `${service}-v${release}`;
            const workflowSha = required(env, 'GITHUB_SHA');
            if (!/^sha256:[a-f0-9]{64}$/.test(digest)) throw Error('Invalid image digest');
            return [
              `Service: ${service}`,
              `Version: ${release}`,
              `Artifact commit: ${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/commit/${sha}`,
              `Deployment workflow commit: ${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/commit/${workflowSha}`,
              `Image: ${image}@${digest}`,
              `Docker tag: ${image}:${tag}`,
            ].join('\n\n');
          }

          async function githubRelease(env, deps = {}) {
            validateInputs(env);
            const request = deps.fetch || fetch;
            const fs = deps.fs || require('node:fs');
            const token = required(env, 'GITHUB_TOKEN');
            const service = env.SERVICE_NAME;
            const release = version(required(env, 'RELEASE_VERSION'), false);
            const tag = `${service}-v${release}`;
            const tagCommit = required(env, 'GITHUB_SHA');
            const body = releaseBody(env);
            const api = required(env, 'GITHUB_API_URL');
            if (api !== 'https://api.github.com') throw Error('Invalid GitHub API URL');
            const base = `${api}/repos/${env.GITHUB_REPOSITORY}`;
            const call = async (path, options = {}) => {
              const response = await request(`${base}${path}`, {
                ...options,
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${token}`,
                  'X-GitHub-Api-Version': '2022-11-28',
                  ...(options.headers || {}),
                },
                signal: AbortSignal.timeout(30000),
              });
              if (response.status === 404) return null;
              if (!response.ok) throw Error(`GitHub Release request failed (${response.status})`);
              return response.json();
            };
            const resolveTag = async () => {
              const ref = await call(`/git/ref/tags/${encodeURIComponent(tag)}`);
              if (!ref) return null;
              let object = ref.object;
              for (let depth = 0; depth < 5 && object.type === 'tag'; depth += 1) {
                const annotated = await call(`/git/tags/${object.sha}`);
                if (!annotated) throw Error('Annotated tag object missing');
                object = annotated.object;
              }
              if (object.type !== 'commit' || !/^[a-f0-9]{40}$/.test(object.sha)) throw Error('Release tag does not resolve to a commit');
              return object.sha;
            };
            const verifyTagCommit = async (commit) => {
              if (commit === tagCommit) return;
              const comparison = await call(`/compare/${tagCommit}...${commit}`);
              if (!comparison || comparison.status !== 'ahead' || comparison.merge_base_commit?.sha !== tagCommit) {
                throw Error('Release tag is not the deployment commit or its descendant');
              }
            };
            const verify = async (existing) => {
              const commit = await resolveTag();
              await verifyTagCommit(commit);
              if (!existing || existing.tag_name !== tag || existing.name !== tag || existing.body !== body || existing.draft || existing.prerelease) {
                throw Error('Existing GitHub Release does not match deployed metadata');
              }
              return existing;
            };

            let existing = await call(`/releases/tags/${encodeURIComponent(tag)}`);
            if (existing) {
              existing = await verify(existing);
            } else {
              const commit = await resolveTag();
              if (commit) await verifyTagCommit(commit);
              existing = await call('/releases', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                  tag_name: tag,
                  target_commitish: 'main',
                  name: tag,
                  body,
                  draft: false,
                  prerelease: false,
                  generate_release_notes: false,
                  make_latest: 'true',
                }),
              });
              if (!existing) throw Error('GitHub Release creation returned no result');
              existing = await verify(existing);
            }
            fs.appendFileSync(env.GITHUB_STEP_SUMMARY, `Release: ${existing.html_url}\n`);
            return existing;
          }

          module.exports = {collision, githubRelease, immutableTagsRequired, publish, releaseBody, releaseCommit, resolveGradleVersion, resolveNpmVersion, validateDeploymentSecrets, validateDeploymentSettings, validateInputs, validatePublishSecrets, verifyArtifactRevision, version};

          if (require.main === module || process.argv[1] === '-') {
            const mode = process.argv[2];
            Promise.resolve()
              .then(() => {
                if (mode === 'validate-inputs') return validateInputs(process.env);
                if (mode === 'resolve-gradle-version') return resolveGradleVersion(process.env);
                if (mode === 'resolve-npm-version') return resolveNpmVersion(process.env);
                if (mode === 'publish') return publish(process.env);
                if (mode === 'github-release') return githubRelease(process.env);
                throw Error('Invalid mode');
              })
              .catch((error) => {
                console.error(error.message);
                process.exitCode = 1;
              });
          }
          RELEASE_SCRIPT
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate inputs
        env:
          SERVICE_NAME: ${{ inputs.service-name }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -Eeuo pipefail
          [[ $SERVICE_NAME == react ]] || { echo 'Invalid service name'; exit 1; }
          [[ $COMPOSE_FILE =~ ^[a-zA-Z0-9][a-zA-Z0-9._/-]*\.ya?ml$ && $COMPOSE_FILE != *..* ]] || { echo 'Invalid Compose path'; exit 1; }
          [[ $DOCKERFILE =~ ^[a-zA-Z0-9][a-zA-Z0-9._/-]*$ && $DOCKERFILE != *..* ]] || { echo 'Invalid Dockerfile path'; exit 1; }
          [[ -f $COMPOSE_FILE && -f $DOCKERFILE ]] || { echo 'Required build file missing'; exit 1; }
  version-policy:
    needs: validate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require an unused production version
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          'use strict';
          (async () => {
            const parsed = require('./package.json');
            const version = String(parsed.version || '');
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) throw Error('Invalid package version');
            const tag = `react-v${version}`;
            const api = process.env.GITHUB_API_URL;
            const repository = process.env.GITHUB_REPOSITORY;
            const token = process.env.GITHUB_TOKEN;
            if (!api || !repository || !token) throw Error('Missing GitHub version lookup configuration');
            const headers = {Accept: 'application/vnd.github+json', Authorization: `Bearer ${token}`};
            for (const path of [`git/ref/tags/${tag}`, `releases/tags/${tag}`]) {
              const response = await fetch(`${api}/repos/${repository}/${path}`, {headers, signal: AbortSignal.timeout(30000)});
              if (response.status === 404) continue;
              if (!response.ok) throw Error(`GitHub version lookup failed (${response.status})`);
              throw Error(`${tag} already exists; increment package.json before merging`);
            }
          })().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
  verify:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GATEWAY_URL: http://127.0.0.1:8090
      API_MOCKING: disabled
      VERCEL_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      FORMAT_BASE_REF: refs/remotes/origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/secret-scan.mjs
      - run: node --test scripts/test-production-workflow.mjs scripts/test-production-rollback.mjs
      - run: npm run verify
  container:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build image without pushing
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: docker build --file "$DOCKERFILE" --tag local/node-ci:test .
      - name: Render production Compose with synthetic values
        env:
          COMPOSE_FILE: ${{ inputs.compose-file }}
        run: |
          test -f "$COMPOSE_FILE"
          mkdir -p "$RUNNER_TEMP/compose"
          cp "$COMPOSE_FILE" "$RUNNER_TEMP/compose/compose.yml"
          node -e 'const fs=require("fs"); const s=fs.readFileSync(process.env.COMPOSE_FILE,"utf8"); const refs=[...s.matchAll(/\$\{([A-Za-z_][A-Za-z0-9_]*)([^}]*)\}/g)]; const names=refs.filter(x=>!x[2].startsWith(":-")).map(x=>x[1]); const value=n=>n==="DEPLOY_ENV_FILE"?".env.prod":n.endsWith("PORT")?"8080":"synthetic"; fs.writeFileSync(process.env.RUNNER_TEMP+"/synthetic.env", [...new Set(names)].filter(n=>n!=="IMAGE_REF").map(n=>n+"="+value(n)).join("\n")+"\nIMAGE_REF=example/image@sha256:"+"a".repeat(64)+"\n")'
          cp "$RUNNER_TEMP/synthetic.env" "$RUNNER_TEMP/compose/.env.prod"
          docker compose --env-file "$RUNNER_TEMP/synthetic.env" -f "$RUNNER_TEMP/compose/compose.yml" config --quiet
  publish:
    needs: [preflight, release-version, validate, verify, container]
    if: ${{ always() && needs.preflight.result == 'success' && needs.release-version.result == 'success' && needs.validate.result == 'success' && needs.verify.result == 'success' && needs.container.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    concurrency:
      group: publish-${{ github.repository }}-${{ inputs.service-name }}-${{ needs.release-version.outputs.version }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.publish.outputs.version }}
      digest: ${{ steps.publish.outputs.digest }}
      tag: ${{ steps.publish.outputs.tag }}
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Publish immutable image
        id: publish
        env:
          SERVICE_NAME: ${{ inputs.service-name }}
          DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          HEALTH_TIMEOUT: ${{ inputs.health-timeout }}
          PLATFORM: ${{ inputs.platform }}
          PUBLIC_ORIGIN: ${{ inputs.public-origin }}
          SERVICE_PROFILE: react
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          COMPOSE_SERVICE: ${{ vars.PROD2_COMPOSE_SERVICE }}
          CONTAINER_NAME: ${{ vars.PROD2_CONTAINER_NAME }}
          REMOTE_DIR: ${{ vars.PROD2_REMOTE_DIR }}
          HEALTH_URL: ${{ vars.PROD2_HEALTH_URL }}
          PROD_COMPOSE_FILE: ${{ vars.PROD2_COMPOSE_FILE }}
          DOCKERHUB_PUSH_TOKEN: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
          PROD2_HOST: ${{ secrets.PROD2_HOST }}
          PROD2_USER: ${{ secrets.PROD2_USER }}
          PROD2_SSH_PORT: ${{ secrets.PROD2_SSH_PORT }}
          PROD2_SSH_PRIVATE_KEY: ${{ secrets.PROD2_SSH_PRIVATE_KEY }}
          PROD2_HOST_FINGERPRINT: ${{ secrets.PROD2_HOST_FINGERPRINT }}
          PROD2_ENV_FILE: ${{ secrets.PROD2_ENV_FILE }}
        run: |
          node - publish <<'RELEASE_SCRIPT'
          'use strict';

          const {execFileSync, spawnSync} = require('node:child_process');

          const serviceProfiles = Object.freeze({
            gateway: 'base',
            batch: 'batch',
            community: 'community-redis',
            auth: 'auth-mysql',
            react: 'react',
          });
          const serviceRepositories = Object.freeze({
            gateway: 'devnogi/devnogi-gateway-server',
            batch: 'devnogi/open-api-batch-server',
            community: 'devnogi/devnogi-community-server',
            auth: 'devnogi/devnogi-auth-server',
            react: 'devnogi/devnogi-react',
          });
          const immutableVersionRules = Object.freeze(Object.keys(serviceProfiles).map(
            (service) => `^${service}-v[0-9]+\\.[0-9]+\\.[0-9]+$`,
          ));

          function required(env, key) {
            if (!env[key] || !env[key].trim()) throw Error(`Missing ${key}`);
            return env[key];
          }

          function validateInputs(env) {
            if (env.GITHUB_REF !== 'refs/heads/main' || !['push', 'workflow_dispatch'].includes(env.GITHUB_EVENT_NAME)) {
              throw Error('Production requires a main push or dispatch');
            }
            if (!/^[a-f0-9]{40}$/.test(required(env, 'GITHUB_SHA'))) throw Error('Invalid commit');
            if (!/^https:\/\/github\.com$/.test(required(env, 'GITHUB_SERVER_URL'))) throw Error('Invalid GitHub server');
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(required(env, 'GITHUB_REPOSITORY'))) throw Error('Invalid caller repository');
            const service = required(env, 'SERVICE_NAME');
            const profile = required(env, 'SERVICE_PROFILE');
            if (required(env, 'DEPLOYMENT_TARGET') !== 'prod2') throw Error('Invalid deployment target');
            if (!Object.hasOwn(serviceProfiles, service) || serviceProfiles[service] !== profile) throw Error('Invalid service profile mapping');
            if (serviceRepositories[service] !== env.GITHUB_REPOSITORY) throw Error('Caller repository does not match service');
            if (service === 'react' && required(env, 'PUBLIC_ORIGIN') !== 'https://www.memonogi.com') throw Error('Invalid public origin');
            if (!/^[a-zA-Z0-9][a-zA-Z0-9._/-]*\.ya?ml$/.test(required(env, 'COMPOSE_FILE')) || env.COMPOSE_FILE.includes('..')) throw Error('Invalid compose path');
            if (!/^[a-zA-Z0-9][a-zA-Z0-9._/-]*$/.test(required(env, 'DOCKERFILE')) || env.DOCKERFILE.includes('..')) throw Error('Invalid Dockerfile path');
            if (!/^[1-9][0-9]{0,2}$/.test(required(env, 'HEALTH_TIMEOUT')) || +env.HEALTH_TIMEOUT > 600) throw Error('Invalid health timeout');
            if (required(env, 'PLATFORM') !== 'linux/amd64') throw Error('Invalid platform');
          }

          function validatePublishSecrets(env) {
            if (!/^[a-z0-9]+(?:[._-][a-z0-9]+)*$/.test(required(env, 'DOCKERHUB_USERNAME'))) throw Error('Invalid Docker Hub username');
            if (required(env, 'DOCKERHUB_REPOSITORY') !== 'devanted/memonogi') throw Error('Invalid Docker Hub repository');
            required(env, 'DOCKERHUB_PUSH_TOKEN');
          }

          function validateDeploymentSettings(env) {
            for (const key of ['COMPOSE_SERVICE', 'CONTAINER_NAME']) {
              if (!/^[a-zA-Z0-9][a-zA-Z0-9_.-]*$/.test(required(env, key))) throw Error(`Invalid ${key}`);
            }
            if (!/^\/(?:[a-zA-Z0-9_-]+\/)*[a-zA-Z0-9_-]+$/.test(required(env, 'REMOTE_DIR'))) throw Error('Invalid remote directory');
            if (!/^http:\/\/127\.0\.0\.1:[1-9][0-9]{0,4}\/[a-zA-Z0-9/_-]*$/.test(required(env, 'HEALTH_URL')) || +new URL(env.HEALTH_URL).port > 65535) throw Error('Invalid health URL');
            if (!/^[a-zA-Z0-9][a-zA-Z0-9._-]*\.ya?ml$/.test(required(env, 'PROD_COMPOSE_FILE'))) throw Error('Invalid production Compose filename');
          }

          function validateDeploymentSecrets(env) {
            if (!Object.values(serviceRepositories).includes(required(env, 'GITHUB_REPOSITORY'))) throw Error('Invalid deployment caller');
            if (!/^[a-zA-Z0-9][a-zA-Z0-9.-]*$/.test(required(env, 'PROD2_HOST'))) throw Error('Invalid production host');
            if (!/^[a-z_][a-z0-9_-]*$/.test(required(env, 'PROD2_USER'))) throw Error('Invalid production user');
            if (required(env, 'PROD2_SSH_PORT') !== '46232') throw Error('Invalid production SSH port');
            if (!/^SHA256:[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]$/.test(required(env, 'PROD2_HOST_FINGERPRINT'))) throw Error('Invalid production fingerprint');
            for (const key of ['PROD2_SSH_PRIVATE_KEY', 'PROD2_ENV_FILE']) required(env, key);
            if (/^\s*(?:export\s+)?IMAGE_REF\s*=/m.test(env.PROD2_ENV_FILE)) throw Error('PROD2_ENV_FILE must not set IMAGE_REF');
            if (env.SERVICE_NAME === 'react' && /^\s*(?:export\s+)?APP_REVISION\s*=/m.test(env.PROD2_ENV_FILE)) throw Error('PROD2_ENV_FILE must not set APP_REVISION');
          }

          function version(value, allowSnapshot = true) {
            const release = allowSnapshot ? value.trim().replace(/-SNAPSHOT$/, '') : value.trim();
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(release)) throw Error('Invalid release version');
            return release;
          }

          function collision(versionDigest) {
            if (versionDigest === null) return 'build';
            if (/^sha256:[a-f0-9]{64}$/.test(versionDigest)) return 'verify-reuse';
            throw Error('Invalid existing tag digest');
          }

          function verifyArtifactRevision(currentSha, artifactRevision, deps = {}) {
            if (!/^[a-f0-9]{40}$/.test(artifactRevision)) throw Error('Invalid existing image revision');
            if (artifactRevision === currentSha) return artifactRevision;
            const git = deps.gitExecFileSync || execFileSync;
            try {
              git('git', ['merge-base', '--is-ancestor', artifactRevision, currentSha], {stdio: 'ignore'});
            } catch {
              throw Error('Existing image revision is not an ancestor of this commit');
            }
            let commits;
            try {
              commits = git('git', ['rev-list', '--reverse', `${artifactRevision}..${currentSha}`], {encoding: 'utf8'}).trim().split(/\r?\n/).filter(Boolean);
            } catch {
              throw Error('Cannot enumerate existing image recovery commits');
            }
            const allowed = (file) => file.startsWith('.github/workflows/') || file === 'scripts/workflow-contract.test.mjs';
            const normalizePins = (file, contents) => {
              if (file === 'scripts/workflow-contract.test.mjs') {
                return contents.replace(/(const pin = ')[a-f0-9]{40}(';)/g, '$1<sha>$2');
              }
              return contents.replace(/(devnogi\/ci-workflows\/\.github\/workflows\/(?:spring|node)-(?:ci|prod)\.yml@)[a-f0-9]{40}/g, '$1<sha>');
            };
            let changed = false;
            for (const commit of commits) {
              let parent;
              let paths;
              try {
                parent = git('git', ['rev-parse', `${commit}^1`], {encoding: 'utf8'}).trim();
                paths = git('git', ['diff', '--name-only', '-z', '--no-renames', parent, commit, '--'], {encoding: 'utf8'}).split(String.fromCharCode(0)).filter(Boolean);
              } catch {
                throw Error('Cannot verify deployment workflow pin changes');
              }
              if (paths.length === 0) continue;
              changed = true;
              if (paths.some((file) => !allowed(file))) throw Error('Existing image revision differs outside deployment workflow files');
              for (const file of paths) {
                let before;
                let after;
                try {
                  before = git('git', ['show', `${parent}:${file}`], {encoding: 'utf8'});
                  after = git('git', ['show', `${commit}:${file}`], {encoding: 'utf8'});
                } catch {
                  throw Error('Existing image recovery cannot add, delete, or rename caller files');
                }
                if (before === after || normalizePins(file, before) !== normalizePins(file, after)) {
                  throw Error('Existing image recovery may change only in-place shared workflow SHAs');
                }
              }
            }
            if (!changed) throw Error('Existing image recovery contains no workflow pin change');
            return artifactRevision;
          }

          function releaseCommit(env) {
            const commit = required(env, 'RELEASE_COMMIT').trim();
            if (!/^[a-f0-9]{40}$/.test(commit)) throw Error('Invalid release commit');
            return commit;
          }

          function immutableTagsRequired(info, tags) {
            if (!info || info.is_private !== true) throw Error('Private Docker Hub repository required');
            const settings = info.immutable_tags_settings;
            if (!settings || settings.enabled !== true || !Array.isArray(settings.rules)) throw Error('Docker Hub immutable tags are required');
            if (settings.rules.length === 0) return;
            if (!Array.isArray(tags) || tags.length !== 1) throw Error('Published tag is required for immutable-rule validation');
            if (!/^(?:gateway|batch|community|auth|react)-v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tags[0])) {
              throw Error('Unexpected published tag format');
            }
            const allTags = settings.rules.includes('.*') || settings.rules.includes('^.*$');
            if (!allTags && !immutableVersionRules.every((rule) => settings.rules.includes(rule))) {
              throw Error('Use all-tag immutability or every documented service version rule');
            }
          }

          function resolveGradleVersion(env, deps = {}) {
            const gradle = deps.execFileSync || execFileSync;
            const fs = deps.fs || require('node:fs');
            let output;
            try {
              output = gradle('./gradlew', ['properties', '-q'], {encoding: 'utf8'});
            } catch {
              throw Error('Gradle version resolution failed');
            }
            const matches = [...output.matchAll(/^version:\s*(.+)$/gm)];
            if (matches.length !== 1) throw Error('Cannot resolve root Gradle version');
            const release = version(matches[0][1]);
            fs.appendFileSync(env.GITHUB_OUTPUT, `version=${release}\n`);
            return release;
          }

          function resolveNpmVersion(env, deps = {}) {
            const fs = deps.fs || require('node:fs');
            let parsed;
            try {
              parsed = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            } catch {
              throw Error('Cannot read package version');
            }
            const release = version(String(parsed.version || ''), false);
            fs.appendFileSync(env.GITHUB_OUTPUT, `version=${release}\n`);
            return release;
          }

          async function hub(path, token, request) {
            const response = await request(`https://hub.docker.com/v2/${path}`, {
              headers: {Authorization: `Bearer ${token}`},
              signal: AbortSignal.timeout(30000),
            });
            if (response.status === 404) return null;
            if (!response.ok) throw Error(`Docker Hub request failed (${response.status})`);
            return response.json();
          }

          function command(name, args) {
            try {
              execFileSync(name, args, {stdio: 'ignore'});
            } catch {
              throw Error('Docker command failed');
            }
          }

          function capture(name, args) {
            try {
              return execFileSync(name, args, {encoding: 'utf8'}).trim();
            } catch {
              throw Error('Docker inspection failed');
            }
          }

          async function publish(env, deps = {}) {
            validateInputs(env);
            validatePublishSecrets(env);
            validateDeploymentSettings(env);
            validateDeploymentSecrets(env);
            const request = deps.fetch || fetch;
            const run = deps.cmd || command;
            const inspect = deps.capture || capture;
            const login = deps.spawnSync || spawnSync;
            const fs = deps.fs || require('node:fs');
            const release = version(required(env, 'RELEASE_VERSION'));
            const sha = env.GITHUB_SHA;
            const service = env.SERVICE_NAME;
            const username = env.DOCKERHUB_USERNAME;
            const image = env.DOCKERHUB_REPOSITORY;
            const [namespace, repository] = image.split('/');
            const versionTag = `${service}-v${release}`;

            const auth = await request('https://hub.docker.com/v2/auth/token', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({identifier: username, secret: env.DOCKERHUB_PUSH_TOKEN}),
              signal: AbortSignal.timeout(30000),
            });
            if (!auth.ok) throw Error(`Docker Hub authentication failed (${auth.status})`);
            const token = (await auth.json()).access_token;
            if (!token) throw Error('Docker Hub token missing');

            const info = await hub(`namespaces/${namespace}/repositories/${repository}`, token, request);
            immutableTagsRequired(info, [versionTag]);
            const readDigest = async (tag) => {
              const tagInfo = await hub(`namespaces/${namespace}/repositories/${repository}/tags/${tag}`, token, request);
              return tagInfo ? tagInfo.digest : null;
            };

            let versionDigest = await readDigest(versionTag);
            const state = collision(versionDigest);
            let digest;
            let artifactRevision = sha;
            const loginResult = login('docker', ['login', '--username', username, '--password-stdin'], {
              input: env.DOCKERHUB_PUSH_TOKEN,
              stdio: ['pipe', 'ignore', 'pipe'],
            });
            if (loginResult.status !== 0) throw Error('Docker login failed');

            if (state === 'verify-reuse') {
              run('docker', ['pull', `${image}:${versionTag}`]);
              const revision = inspect('docker', ['image', 'inspect', '--format', '{{ index .Config.Labels "org.opencontainers.image.revision" }}', `${image}:${versionTag}`]);
              const imageVersion = inspect('docker', ['image', 'inspect', '--format', '{{ index .Config.Labels "org.opencontainers.image.version" }}', `${image}:${versionTag}`]);
              const source = inspect('docker', ['image', 'inspect', '--format', '{{ index .Config.Labels "org.opencontainers.image.source" }}', `${image}:${versionTag}`]);
              const repoDigests = JSON.parse(inspect('docker', ['image', 'inspect', '--format', '{{json .RepoDigests}}', `${image}:${versionTag}`]));
              if (imageVersion !== release || source !== `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}` || !repoDigests.includes(`${image}@${versionDigest}`)) {
                throw Error('Existing tag does not match this commit and version');
              }
              artifactRevision = verifyArtifactRevision(sha, revision, deps);
              digest = versionDigest;
            } else {
              if (await readDigest(versionTag) !== null) throw Error('Tag appeared before publication');

              const metadataFile = `${env.RUNNER_TEMP}/build-metadata.json`;
              run('docker', [
                'buildx', 'build', '--push',
                '--platform', env.PLATFORM,
                '--file', env.DOCKERFILE,
                '--tag', `${image}:${versionTag}`,
                '--label', `org.opencontainers.image.revision=${sha}`,
                '--label', `org.opencontainers.image.source=${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}`,
                '--label', `org.opencontainers.image.version=${release}`,
                ...(service === 'react' ? ['--build-arg', `APP_REVISION=${sha}`] : []),
                '--metadata-file', metadataFile,
                '.',
              ]);
              let metadata;
              try {
                metadata = JSON.parse(fs.readFileSync(metadataFile, 'utf8'));
              } catch {
                throw Error('Buildx metadata unavailable');
              }
              digest = metadata['containerimage.digest'];
              if (!/^sha256:[a-f0-9]{64}$/.test(digest || '')) throw Error('Buildx digest unavailable');
              versionDigest = await readDigest(versionTag);
              if (versionDigest !== digest) throw Error('Registry digest does not match Buildx output');
            }

            fs.appendFileSync(env.GITHUB_OUTPUT, `version=${release}\ndigest=${digest}\ntag=${versionTag}\ncommit=${artifactRevision}\n`);
            fs.appendFileSync(env.GITHUB_STEP_SUMMARY, `Service: ${service}\n\nVersion: ${release}\n\nTag: ${versionTag}\n\nArtifact commit: ${artifactRevision}\n\nWorkflow commit: ${sha}\n\nDigest: ${digest}\n`);
          }

          function releaseBody(env) {
            const service = required(env, 'SERVICE_NAME');
            const release = version(required(env, 'RELEASE_VERSION'), false);
            const sha = releaseCommit(env);
            const digest = required(env, 'IMAGE_DIGEST');
            const image = required(env, 'DOCKERHUB_REPOSITORY');
            const tag = `${service}-v${release}`;
            const workflowSha = required(env, 'GITHUB_SHA');
            if (!/^sha256:[a-f0-9]{64}$/.test(digest)) throw Error('Invalid image digest');
            return [
              `Service: ${service}`,
              `Version: ${release}`,
              `Artifact commit: ${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/commit/${sha}`,
              `Deployment workflow commit: ${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/commit/${workflowSha}`,
              `Image: ${image}@${digest}`,
              `Docker tag: ${image}:${tag}`,
            ].join('\n\n');
          }

          async function githubRelease(env, deps = {}) {
            validateInputs(env);
            const request = deps.fetch || fetch;
            const fs = deps.fs || require('node:fs');
            const token = required(env, 'GITHUB_TOKEN');
            const service = env.SERVICE_NAME;
            const release = version(required(env, 'RELEASE_VERSION'), false);
            const tag = `${service}-v${release}`;
            const tagCommit = required(env, 'GITHUB_SHA');
            const body = releaseBody(env);
            const api = required(env, 'GITHUB_API_URL');
            if (api !== 'https://api.github.com') throw Error('Invalid GitHub API URL');
            const base = `${api}/repos/${env.GITHUB_REPOSITORY}`;
            const call = async (path, options = {}) => {
              const response = await request(`${base}${path}`, {
                ...options,
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${token}`,
                  'X-GitHub-Api-Version': '2022-11-28',
                  ...(options.headers || {}),
                },
                signal: AbortSignal.timeout(30000),
              });
              if (response.status === 404) return null;
              if (!response.ok) throw Error(`GitHub Release request failed (${response.status})`);
              return response.json();
            };
            const resolveTag = async () => {
              const ref = await call(`/git/ref/tags/${encodeURIComponent(tag)}`);
              if (!ref) return null;
              let object = ref.object;
              for (let depth = 0; depth < 5 && object.type === 'tag'; depth += 1) {
                const annotated = await call(`/git/tags/${object.sha}`);
                if (!annotated) throw Error('Annotated tag object missing');
                object = annotated.object;
              }
              if (object.type !== 'commit' || !/^[a-f0-9]{40}$/.test(object.sha)) throw Error('Release tag does not resolve to a commit');
              return object.sha;
            };
            const verifyTagCommit = async (commit) => {
              if (commit === tagCommit) return;
              const comparison = await call(`/compare/${tagCommit}...${commit}`);
              if (!comparison || comparison.status !== 'ahead' || comparison.merge_base_commit?.sha !== tagCommit) {
                throw Error('Release tag is not the deployment commit or its descendant');
              }
            };
            const verify = async (existing) => {
              const commit = await resolveTag();
              await verifyTagCommit(commit);
              if (!existing || existing.tag_name !== tag || existing.name !== tag || existing.body !== body || existing.draft || existing.prerelease) {
                throw Error('Existing GitHub Release does not match deployed metadata');
              }
              return existing;
            };

            let existing = await call(`/releases/tags/${encodeURIComponent(tag)}`);
            if (existing) {
              existing = await verify(existing);
            } else {
              const commit = await resolveTag();
              if (commit) await verifyTagCommit(commit);
              existing = await call('/releases', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                  tag_name: tag,
                  target_commitish: 'main',
                  name: tag,
                  body,
                  draft: false,
                  prerelease: false,
                  generate_release_notes: false,
                  make_latest: 'true',
                }),
              });
              if (!existing) throw Error('GitHub Release creation returned no result');
              existing = await verify(existing);
            }
            fs.appendFileSync(env.GITHUB_STEP_SUMMARY, `Release: ${existing.html_url}\n`);
            return existing;
          }

          module.exports = {collision, githubRelease, immutableTagsRequired, publish, releaseBody, releaseCommit, resolveGradleVersion, resolveNpmVersion, validateDeploymentSecrets, validateDeploymentSettings, validateInputs, validatePublishSecrets, verifyArtifactRevision, version};

          if (require.main === module || process.argv[1] === '-') {
            const mode = process.argv[2];
            Promise.resolve()
              .then(() => {
                if (mode === 'validate-inputs') return validateInputs(process.env);
                if (mode === 'resolve-gradle-version') return resolveGradleVersion(process.env);
                if (mode === 'resolve-npm-version') return resolveNpmVersion(process.env);
                if (mode === 'publish') return publish(process.env);
                if (mode === 'github-release') return githubRelease(process.env);
                throw Error('Invalid mode');
              })
              .catch((error) => {
                console.error(error.message);
                process.exitCode = 1;
              });
          }
          RELEASE_SCRIPT
  deploy:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: production-${{ github.repository }}-${{ inputs.service-name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Deploy and verify or roll back
        env:
          DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          HEALTH_TIMEOUT: ${{ inputs.health-timeout }}
          COMPOSE_SERVICE: ${{ vars.PROD2_COMPOSE_SERVICE }}
          CONTAINER_NAME: ${{ vars.PROD2_CONTAINER_NAME }}
          REMOTE_DIR: ${{ vars.PROD2_REMOTE_DIR }}
          HEALTH_URL: ${{ vars.PROD2_HEALTH_URL }}
          PROD_COMPOSE_FILE: ${{ vars.PROD2_COMPOSE_FILE }}
          IMAGE_REF: ${{ format('{0}@{1}', vars.DOCKERHUB_REPOSITORY, needs.publish.outputs.digest) }}
          REACT_PUBLIC_MODE: '1'
          PUBLIC_ORIGIN: ${{ inputs.public-origin }}
          ARTIFACT_REVISION: ${{ needs.publish.outputs.commit }}

          PROD2_HOST: ${{ secrets.PROD2_HOST }}
          PROD2_USER: ${{ secrets.PROD2_USER }}
          PROD2_SSH_PORT: ${{ secrets.PROD2_SSH_PORT }}
          PROD2_SSH_PRIVATE_KEY: ${{ secrets.PROD2_SSH_PRIVATE_KEY }}
          PROD2_HOST_FINGERPRINT: ${{ secrets.PROD2_HOST_FINGERPRINT }}
          PROD2_ENV_FILE: ${{ secrets.PROD2_ENV_FILE }}
        run: |
          REMOTE_SCRIPT="$RUNNER_TEMP/deploy-remote.sh"
          export REMOTE_SCRIPT
          cat > "$REMOTE_SCRIPT" <<'REMOTE_SCRIPT_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          action=$1; dir=$2; service=$3; container=$4; image=$5; url=$6; timeout=$7; run=$8; stage=$9; legacy_compose=${10}; revision=${11}
          curl_bin=${DEPLOY_CURL_BIN:-curl}; sleep_bin=${DEPLOY_SLEEP_BIN:-sleep}
          [[ $action == activate || $action == activate-guarded || $action == finalize || $action == finalize-guarded || $action == rollback || $action == rollback-guarded || $action == watchdog ]] || exit 1
          [[ $dir =~ ^/([a-zA-Z0-9_-]+/)*[a-zA-Z0-9_-]+$ && $service =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ && $container =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]] || exit 1
          [[ $image =~ ^[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ && $revision =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ $url =~ ^http://127\.0\.0\.1:[1-9][0-9]{0,4}/[a-zA-Z0-9/_-]*$ && $timeout =~ ^[1-9][0-9]{0,2}$ && $timeout -le 600 ]] || exit 1
          [[ $run =~ ^[0-9]+-[0-9]+$ && $stage == "$dir/.candidate-$run" && $legacy_compose =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*\.ya?ml$ ]] || exit 1
          backup="$dir/.backup-$run"
          # Every operation that can own the lock runs in a bounded process group. Its
          # wrapper remains outside that group so it can report a killed rollback.
          if [[ $action == activate || $action == finalize || $action == rollback ]]; then
            script="$backup/remote.sh"
            [[ $action != activate ]] || script="$stage/remote.sh"
            [[ -f $script ]] || { [[ $action != rollback ]] || echo 'DEPLOY_RESULT=ROLLBACK_FAILED'; exit 2; }
            set +e
            timeout --signal=KILL "$((timeout * 2 + 60))s" bash "$script" "$action-guarded" "$dir" "$service" "$container" "$image" "$url" "$timeout" "$run" "$stage" "$legacy_compose" "$revision"
            result=$?
            set -e
            if [[ $result == 124 || $result == 137 ]]; then
              if [[ $action == rollback ]]; then echo 'DEPLOY_RESULT=ROLLBACK_FAILED'; exit 2; fi
              echo 'DEPLOY_RESULT=ACTION_TIMEOUT'; exit 1
            fi
            exit "$result"
          fi
          if [[ $action == watchdog ]]; then
            [[ -d $backup ]] || exit 1
            : > "$backup/watchdog-ready"
            "$sleep_bin" "$((timeout * 2 + 90))"
            exec bash "$backup/remote.sh" rollback "$dir" "$service" "$container" "$image" "$url" "$timeout" "$run" "$stage" "$legacy_compose" "$revision"
          fi
          cd "$dir"
          exec 9>.deploy.lock
          if [[ ${DEPLOY_WATCHDOG:-} == 1 ]]; then flock 9; else flock -w 30 9 || { echo 'DEPLOY_RESULT=LOCK_FAILED'; exit 2; }; fi

          health() {
            local expected=$1 actual status code deadline=$((SECONDS + timeout))
            while (( SECONDS < deadline )); do
              actual=$(docker inspect --format '{{.Image}}' "$container" 9>&- 2>/dev/null) || actual=''
              status=$(docker inspect --format '{{.State.Running}} {{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container" 9>&- 2>/dev/null) || status=''
              if [[ $actual == "$expected" && ( $status == 'true healthy' || $status == 'true none' ) ]]; then
                code=$("$curl_bin" --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 5 "$url" 2>/dev/null) || code=''
                [[ $code == 200 ]] && return 0
              fi
              "$sleep_bin" 5
            done
            return 1
          }
          owned() { [[ -f .deploy-marker && $(<.deploy-marker) == "$run" && -f $backup/image-id && -f $backup/compose-name ]]; }
          rollback() {
            owned || { echo 'Rollback refused: marker ownership changed'; return 1; }
            local original previous
            original=$(<"$backup/compose-name"); previous=$(<"$backup/image-id")
            [[ $original =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*\.ya?ml$ && $previous =~ ^sha256:[a-f0-9]{64}$ ]] || return 1
            cp "$backup/compose.original" "$original" && cp "$backup/env.original" .env.prod || return 1
            if [[ ! -f $backup/canonical-existed ]]; then rm -f compose.yml || return 1; fi
            IMAGE_REF="$previous" docker compose --project-directory "$dir" --env-file .env.prod -f "$original" -f "$backup/rollback.override.yml" up -d --pull never --no-deps "$service" 9>&- || return 1
            health "$previous" || return 1
            rm -f .deploy-marker || return 1
            echo 'DEPLOY_RESULT=ROLLED_BACK'
          }

          if [[ $action == rollback-guarded ]]; then
            if [[ ! -f .deploy-marker && ${DEPLOY_WATCHDOG:-} == 1 ]]; then exit 0; fi
            if rollback; then exit 0; else echo 'DEPLOY_RESULT=ROLLBACK_FAILED'; exit 2; fi
          fi
          if [[ $action == finalize-guarded ]]; then
            owned || { echo 'DEPLOY_RESULT=MARKER_CONFLICT'; exit 1; }
            expected=$(<"$backup/candidate-image-id")
            health "$expected" || { echo 'DEPLOY_RESULT=FINALIZE_FAILED'; exit 1; }
            rm -f .deploy-marker
            echo 'DEPLOY_RESULT=SUCCESS'
            exit 0
          fi

          trap 'rm -rf "$stage"' EXIT
          [[ ! -e .deploy-marker && ! -e $backup && -f "$stage/compose.yml" && -f "$stage/.env.prod" && -f "$stage/remote.sh" && -f .env.prod ]] || { echo 'Required state absent or deployment already pending'; exit 1; }
          if [[ -f compose.yml ]]; then original=compose.yml; elif [[ -f $legacy_compose ]]; then original=$legacy_compose; else exit 1; fi
          previous=$(docker inspect --format '{{.Image}}' "$container" 9>&-)
          [[ $previous =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          if grep -Eq '^\s*(export\s+)?(IMAGE_REF|APP_REVISION)\s*=' "$stage/.env.prod"; then echo 'Candidate environment contains reserved value'; exit 1; fi
          printf '\nIMAGE_REF=%s\n' "$image" >> "$stage/.env.prod"
          compose_candidate() { IMAGE_REF="$image" docker compose --project-directory "$dir" --env-file "$stage/.env.prod" -f "$stage/compose.yml" "$@" 9>&-; }
          [[ $(compose_candidate config --images "$service") == "$image" ]] || exit 1
          mkdir "$backup"
          cp "$original" "$backup/compose.original"; cp .env.prod "$backup/env.original"; cp "$stage/remote.sh" "$backup/remote.sh"
          printf '%s\n' "$original" > "$backup/compose-name"; printf '%s\n' "$previous" > "$backup/image-id"
          if [[ $original == compose.yml ]]; then touch "$backup/canonical-existed"; fi
          printf 'services:\n  %s:\n    image: %s\n' "$service" "$previous" > "$backup/rollback.override.yml"
          # Launch the detached recovery process before creating the marker. It waits for
          # the public verification deadline and obtains the same lock before recovery.
          DEPLOY_WATCHDOG=1 setsid nohup bash "$backup/remote.sh" watchdog "$dir" "$service" "$container" "$image" "$url" "$timeout" "$run" "$stage" "$legacy_compose" "$revision" >"$backup/watchdog.log" 2>&1 </dev/null 9>&- &
          for ((attempt=0; attempt<50; attempt++)); do
            [[ -f $backup/watchdog-ready ]] && break
            sleep 0.1
          done
          [[ -f $backup/watchdog-ready ]] || { echo 'Recovery watchdog did not start'; exit 1; }
          printf '%s\n' "$run" > .deploy-marker
          failure() { trap - ERR HUP INT TERM; if rollback; then exit 1; else echo 'DEPLOY_RESULT=ROLLBACK_FAILED'; exit 2; fi; }
          trap failure ERR HUP INT TERM
          compose_candidate pull "$service"
          candidate=$(docker image inspect --format '{{.Id}}' "$image" 9>&-)
          label=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image" 9>&-)
          image_revision=$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$image" 9>&- | sed -n 's/^APP_REVISION=//p')
          [[ $candidate =~ ^sha256:[a-f0-9]{64}$ && $label == "$revision" && $image_revision == "$revision" ]]
          printf '%s\n' "$candidate" > "$backup/candidate-image-id"
          cp "$stage/compose.yml" compose.yml; cp "$stage/.env.prod" .env.prod
          IMAGE_REF="$image" docker compose --project-directory "$dir" --env-file .env.prod -f compose.yml up -d --pull never --no-deps "$service" 9>&-
          container_revision=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container" 9>&- | sed -n 's/^APP_REVISION=//p')
          [[ $container_revision == "$revision" ]]
          health "$candidate"
          trap - ERR HUP INT TERM
          echo 'DEPLOY_RESULT=ACTIVATED'
          REMOTE_SCRIPT_EOF
          PUBLIC_SCRIPT="$RUNNER_TEMP/public-probe.cjs"
          export PUBLIC_SCRIPT
          cat > "$PUBLIC_SCRIPT" <<'PUBLIC_SCRIPT_EOF'
          'use strict';

          const ORIGIN = 'https://www.memonogi.com';
          const routes = [
            ['/api/health', (body, revision) => { const data = JSON.parse(body); return data.service === 'devnogi-react' && data.revision === revision; }],
            ['/', (body) => /<h1\b[^>]*>\s*마비노기 경매장·시세·아이템 정보\s*<\/h1>/.test(body)],
            ['/auction-history', (body) => /<h1\b[^>]*>\s*마비노기 경매장 거래내역·아이템 시세 검색\s*<\/h1>/.test(body)],
            ['/sitemap.xml', (body) => ['/', '/auction-history', '/community'].every((path) => body.includes(`<loc>${ORIGIN}${path}</loc>`))],
            ['/robots.txt', (body) => body.includes(`Sitemap: ${ORIGIN}/sitemap.xml`)],
          ];

          async function probe({origin, revision, timeout, request = fetch, now = Date.now, wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))}) {
            if (origin !== ORIGIN || !/^[a-f0-9]{40}$/.test(revision) || !/^[1-9][0-9]{0,2}$/.test(String(timeout)) || +timeout > 600) throw Error('Invalid public probe inputs');
            const deadline = now() + timeout * 1000;
            while (now() < deadline) {
              let passed = true;
              for (const [path, check] of routes) {
                const remaining = deadline - now();
                if (remaining <= 0) { passed = false; break; }
                try {
                  const response = await request(`${origin}${path}`, {redirect: 'manual', cache: 'no-store', signal: AbortSignal.timeout(Math.min(5000, remaining))});
                  if (response.status !== 200 || !check(await response.text(), revision)) { passed = false; break; }
                } catch { passed = false; break; }
              }
              if (passed) return;
              const remaining = deadline - now();
              if (remaining > 0) await wait(Math.min(5000, remaining));
            }
            throw Error('Public verification failed or timed out');
          }

          module.exports = {probe, routes};
          if (require.main === module) probe({origin: process.env.PUBLIC_ORIGIN, revision: process.env.ARTIFACT_REVISION, timeout: process.env.HEALTH_TIMEOUT}).catch((error) => { console.error(error.message); process.exitCode = 1; });
          PUBLIC_SCRIPT_EOF

          bash <<'DEPLOY_SCRIPT_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          [[ $GITHUB_REF == refs/heads/main && ( $GITHUB_EVENT_NAME == push || $GITHUB_EVENT_NAME == workflow_dispatch ) ]] || exit 1
          [[ $DEPLOYMENT_TARGET == prod2 ]] || exit 1
          case "$GITHUB_REPOSITORY" in
            devnogi/devnogi-gateway-server|devnogi/open-api-batch-server|devnogi/devnogi-community-server|devnogi/devnogi-auth-server|devnogi/devnogi-react) ;;
            *) echo 'Invalid deployment caller'; exit 1 ;;
          esac
          [[ $GITHUB_RUN_ID =~ ^[0-9]+$ && $GITHUB_RUN_ATTEMPT =~ ^[0-9]+$ && $IMAGE_REF =~ ^[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]] || exit 1
          [[ $COMPOSE_SERVICE =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ && $CONTAINER_NAME =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]] || exit 1
          [[ $REMOTE_DIR =~ ^/([a-zA-Z0-9_-]+/)*[a-zA-Z0-9_-]+$ && $PROD2_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && $PROD2_USER =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 1
          [[ $HEALTH_URL =~ ^http://127\.0\.0\.1:[1-9][0-9]{0,4}/[a-zA-Z0-9/_-]*$ && $HEALTH_TIMEOUT =~ ^[1-9][0-9]{0,2}$ && $HEALTH_TIMEOUT -le 600 ]] || exit 1
          health_port=${HEALTH_URL#http://127.0.0.1:}
          health_port=${health_port%%/*}
          [[ $health_port -le 65535 ]] || exit 1
          [[ $PROD2_SSH_PORT == 46232 ]] || exit 1
          [[ $COMPOSE_FILE =~ ^[a-zA-Z0-9][a-zA-Z0-9._/-]*\.ya?ml$ && $COMPOSE_FILE != *..* && -f $COMPOSE_FILE ]] || exit 1
          [[ $PROD_COMPOSE_FILE =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*\.ya?ml$ ]] || exit 1
          [[ -n $PROD2_SSH_PRIVATE_KEY && -n $PROD2_ENV_FILE && $PROD2_HOST_FINGERPRINT =~ ^SHA256:[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]$ ]] || exit 1
          if grep -Eq '^\s*(export\s+)?IMAGE_REF\s*=' <<< "$PROD2_ENV_FILE"; then echo 'Invalid environment'; exit 1; fi
          if [[ ${REACT_PUBLIC_MODE:-0} == 1 ]]; then
            [[ $GITHUB_REPOSITORY == devnogi/devnogi-react && ${PUBLIC_ORIGIN:-} == 'https://www.memonogi.com' && ${ARTIFACT_REVISION:-} =~ ^[a-f0-9]{40}$ ]] || exit 1
            if grep -Eq '^\s*(export\s+)?APP_REVISION\s*=' <<< "$PROD2_ENV_FILE"; then echo 'Invalid environment'; exit 1; fi
          fi

          work=$(mktemp -d "$RUNNER_TEMP/deploy.XXXXXXXX")
          trap 'rm -rf "$work"' EXIT
          if ! ssh-keyscan -T 15 -p "$PROD2_SSH_PORT" -t ed25519 "$PROD2_HOST" >"$work/known_hosts" 2>"$work/scan.log" ||
             ! awk 'NF != 3 || $2 != "ssh-ed25519" { bad=1 } END { exit (bad || NR != 1) }' "$work/known_hosts"; then
            echo 'Host key scan failed'; exit 1
          fi
          fingerprint=$(ssh-keygen -E sha256 -lf "$work/known_hosts" 2>"$work/scan.log") || { echo 'Host key validation failed'; exit 1; }
          [[ $fingerprint == "256 $PROD2_HOST_FINGERPRINT "*' (ED25519)' ]] || { echo 'Host key validation failed'; exit 1; }
          printf '%s\n' "$PROD2_SSH_PRIVATE_KEY" > "$work/key"
          printf '%s\n' "$PROD2_ENV_FILE" > "$work/env"
          chmod 600 "$work/key" "$work/known_hosts" "$work/env"
          if [[ ${REACT_PUBLIC_MODE:-0} == 1 ]]; then
            cp "$COMPOSE_FILE" "$work/compose.yml"
            cp "$work/env" "$work/.env.prod"
            if ! IMAGE_REF="$IMAGE_REF" docker compose --project-directory "$work" --env-file "$work/.env.prod" -f "$work/compose.yml" config --format json 2>/dev/null | node -e 'let s=""; process.stdin.on("data", x => s += x); process.stdin.on("end", () => { try { const service = JSON.parse(s).services[process.env.COMPOSE_SERVICE]; if (!service || Object.hasOwn(service.environment || {}, "APP_REVISION")) process.exitCode = 1; } catch { process.exitCode = 1; } });'; then
              echo 'React Compose configuration must not override APP_REVISION'; exit 1
            fi
          fi
          opts=(-i "$work/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=15)
          run="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          stage="$REMOTE_DIR/.candidate-$run"
          legacy_compose=$PROD_COMPOSE_FILE

          report_remote_result() {
            local status=$1 log=$2
            if [[ $status -eq 0 ]] && grep -qx 'DEPLOY_RESULT=SUCCESS' "$log"; then
              echo 'Deployment health verified'
              return 0
            fi
            if grep -qx 'DEPLOY_RESULT=ROLLBACK_FAILED' "$log"; then
              echo 'Deployment failed and rollback verification failed'
              return 2
            fi
            if grep -qx 'DEPLOY_RESULT=ROLLED_BACK' "$log"; then
              echo 'Deployment failed; previous service image and health were restored'
              return 1
            fi
            echo 'Deployment failed before a verified recovery result was received'
            return 1
          }

          if ! ssh -p "$PROD2_SSH_PORT" "${opts[@]}" "$PROD2_USER@$PROD2_HOST" "mkdir '$stage'" >"$work/ssh.log" 2>&1; then
            echo 'Could not create deployment candidate'
            exit 1
          fi
          if ! scp -P "$PROD2_SSH_PORT" "${opts[@]}" "$COMPOSE_FILE" "$PROD2_USER@$PROD2_HOST:$stage/compose.yml" >"$work/ssh.log" 2>&1 ||
             ! scp -P "$PROD2_SSH_PORT" "${opts[@]}" "$work/env" "$PROD2_USER@$PROD2_HOST:$stage/.env.prod" >"$work/ssh.log" 2>&1; then
            ssh -p "$PROD2_SSH_PORT" "${opts[@]}" "$PROD2_USER@$PROD2_HOST" "rm -rf '$stage'" >"$work/ssh.log" 2>&1 || true
            echo 'Could not stage deployment candidate'
            exit 1
          fi
          if [[ ${REACT_PUBLIC_MODE:-0} == 1 ]]; then
            if ! scp -P "$PROD2_SSH_PORT" "${opts[@]}" "$REMOTE_SCRIPT" "$PROD2_USER@$PROD2_HOST:$stage/remote.sh" >"$work/ssh.log" 2>&1; then
              ssh -p "$PROD2_SSH_PORT" "${opts[@]}" "$PROD2_USER@$PROD2_HOST" "rm -rf '$stage'" >"$work/ssh.log" 2>&1 || true
              echo 'Could not stage recovery script'; exit 1
            fi
            remote_action() {
              local action=$1
              ssh -p "$PROD2_SSH_PORT" "${opts[@]}" "$PROD2_USER@$PROD2_HOST" bash -s -- \
                "$action" "$REMOTE_DIR" "$COMPOSE_SERVICE" "$CONTAINER_NAME" "$IMAGE_REF" "$HEALTH_URL" "$HEALTH_TIMEOUT" "$run" "$stage" "$legacy_compose" "$ARTIFACT_REVISION" \
                < "$REMOTE_SCRIPT" >"$work/ssh.log" 2>&1
            }
            recover() {
              trap - HUP INT TERM
              if remote_action rollback && grep -qx 'DEPLOY_RESULT=ROLLED_BACK' "$work/ssh.log"; then
                echo 'Deployment failed; previous service image and health were restored'
                return 1
              fi
              echo 'Deployment failed and rollback verification failed; host watchdog retains recovery ownership'
              return 2
            }
            trap 'recover; exit $?' HUP INT TERM
            if ! remote_action activate || ! grep -qx 'DEPLOY_RESULT=ACTIVATED' "$work/ssh.log"; then
              if grep -qx 'DEPLOY_RESULT=ROLLED_BACK' "$work/ssh.log"; then echo 'Deployment failed; previous service restored'; exit 1; fi
              if grep -qx 'DEPLOY_RESULT=ROLLBACK_FAILED' "$work/ssh.log"; then echo 'Deployment failed and rollback verification failed'; exit 2; fi
              recover || exit $?
            fi
            if ! node "$PUBLIC_SCRIPT"; then recover || exit $?; fi
            if ! remote_action finalize || ! grep -qx 'DEPLOY_RESULT=SUCCESS' "$work/ssh.log"; then recover || exit $?; fi
            trap - HUP INT TERM
            echo 'Public deployment verified and finalized'
            exit 0
          fi
          set +e
          ssh -p "$PROD2_SSH_PORT" "${opts[@]}" "$PROD2_USER@$PROD2_HOST" bash -s -- \
            "$REMOTE_DIR" "$COMPOSE_SERVICE" "$CONTAINER_NAME" "$IMAGE_REF" "$HEALTH_URL" "$HEALTH_TIMEOUT" "$run" "$stage" "$legacy_compose" \
            < "$REMOTE_SCRIPT" >"$work/ssh.log" 2>&1
          remote_status=$?
          set -e
          report_remote_result "$remote_status" "$work/ssh.log" || exit $?
          DEPLOY_SCRIPT_EOF
  release:
    needs: [publish, deploy]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create or verify GitHub Release
        env:
          SERVICE_NAME: ${{ inputs.service-name }}
          DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          HEALTH_TIMEOUT: ${{ inputs.health-timeout }}
          PLATFORM: ${{ inputs.platform }}
          PUBLIC_ORIGIN: ${{ inputs.public-origin }}
          SERVICE_PROFILE: react
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_COMMIT: ${{ needs.publish.outputs.commit }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - github-release <<'RELEASE_SCRIPT'
          'use strict';

          const {execFileSync, spawnSync} = require('node:child_process');

          const serviceProfiles = Object.freeze({
            gateway: 'base',
            batch: 'batch',
            community: 'community-redis',
            auth: 'auth-mysql',
            react: 'react',
          });
          const serviceRepositories = Object.freeze({
            gateway: 'devnogi/devnogi-gateway-server',
            batch: 'devnogi/open-api-batch-server',
            community: 'devnogi/devnogi-community-server',
            auth: 'devnogi/devnogi-auth-server',
            react: 'devnogi/devnogi-react',
          });
          const immutableVersionRules = Object.freeze(Object.keys(serviceProfiles).map(
            (service) => `^${service}-v[0-9]+\\.[0-9]+\\.[0-9]+$`,
          ));

          function required(env, key) {
            if (!env[key] || !env[key].trim()) throw Error(`Missing ${key}`);
            return env[key];
          }

          function validateInputs(env) {
            if (env.GITHUB_REF !== 'refs/heads/main' || !['push', 'workflow_dispatch'].includes(env.GITHUB_EVENT_NAME)) {
              throw Error('Production requires a main push or dispatch');
            }
            if (!/^[a-f0-9]{40}$/.test(required(env, 'GITHUB_SHA'))) throw Error('Invalid commit');
            if (!/^https:\/\/github\.com$/.test(required(env, 'GITHUB_SERVER_URL'))) throw Error('Invalid GitHub server');
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(required(env, 'GITHUB_REPOSITORY'))) throw Error('Invalid caller repository');
            const service = required(env, 'SERVICE_NAME');
            const profile = required(env, 'SERVICE_PROFILE');
            if (required(env, 'DEPLOYMENT_TARGET') !== 'prod2') throw Error('Invalid deployment target');
            if (!Object.hasOwn(serviceProfiles, service) || serviceProfiles[service] !== profile) throw Error('Invalid service profile mapping');
            if (serviceRepositories[service] !== env.GITHUB_REPOSITORY) throw Error('Caller repository does not match service');
            if (service === 'react' && required(env, 'PUBLIC_ORIGIN') !== 'https://www.memonogi.com') throw Error('Invalid public origin');
            if (!/^[a-zA-Z0-9][a-zA-Z0-9._/-]*\.ya?ml$/.test(required(env, 'COMPOSE_FILE')) || env.COMPOSE_FILE.includes('..')) throw Error('Invalid compose path');
            if (!/^[a-zA-Z0-9][a-zA-Z0-9._/-]*$/.test(required(env, 'DOCKERFILE')) || env.DOCKERFILE.includes('..')) throw Error('Invalid Dockerfile path');
            if (!/^[1-9][0-9]{0,2}$/.test(required(env, 'HEALTH_TIMEOUT')) || +env.HEALTH_TIMEOUT > 600) throw Error('Invalid health timeout');
            if (required(env, 'PLATFORM') !== 'linux/amd64') throw Error('Invalid platform');
          }

          function validatePublishSecrets(env) {
            if (!/^[a-z0-9]+(?:[._-][a-z0-9]+)*$/.test(required(env, 'DOCKERHUB_USERNAME'))) throw Error('Invalid Docker Hub username');
            if (required(env, 'DOCKERHUB_REPOSITORY') !== 'devanted/memonogi') throw Error('Invalid Docker Hub repository');
            required(env, 'DOCKERHUB_PUSH_TOKEN');
          }

          function validateDeploymentSettings(env) {
            for (const key of ['COMPOSE_SERVICE', 'CONTAINER_NAME']) {
              if (!/^[a-zA-Z0-9][a-zA-Z0-9_.-]*$/.test(required(env, key))) throw Error(`Invalid ${key}`);
            }
            if (!/^\/(?:[a-zA-Z0-9_-]+\/)*[a-zA-Z0-9_-]+$/.test(required(env, 'REMOTE_DIR'))) throw Error('Invalid remote directory');
            if (!/^http:\/\/127\.0\.0\.1:[1-9][0-9]{0,4}\/[a-zA-Z0-9/_-]*$/.test(required(env, 'HEALTH_URL')) || +new URL(env.HEALTH_URL).port > 65535) throw Error('Invalid health URL');
            if (!/^[a-zA-Z0-9][a-zA-Z0-9._-]*\.ya?ml$/.test(required(env, 'PROD_COMPOSE_FILE'))) throw Error('Invalid production Compose filename');
          }

          function validateDeploymentSecrets(env) {
