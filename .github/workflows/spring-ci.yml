name: Spring verification
on:
  workflow_call:
    inputs:
      service-profile:
        required: true
        type: string
      service-name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      compose-file:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate inputs
        env:
          PROFILE: ${{ inputs.service-profile }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          set -Eeuo pipefail
          case "$SERVICE_NAME:$PROFILE" in
            gateway:base|auth:auth-mysql|community:community-redis|batch:batch) ;;
            *) echo 'Invalid service profile mapping'; exit 1 ;;
          esac
          [[ $COMPOSE_FILE =~ ^[a-zA-Z0-9][a-zA-Z0-9._/-]*\.ya?ml$ && $COMPOSE_FILE != *..* ]] || { echo 'Invalid Compose path'; exit 1; }
          [[ $DOCKERFILE =~ ^[a-zA-Z0-9][a-zA-Z0-9._/-]*$ && $DOCKERFILE != *..* ]] || { echo 'Invalid Dockerfile path'; exit 1; }
          [[ -f $COMPOSE_FILE ]] || { echo 'Compose file does not exist'; exit 1; }
          [[ -f $DOCKERFILE ]] || { echo 'Dockerfile does not exist'; exit 1; }
  version-policy:
    needs: validate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Require an unused production version
        env:
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          node <<'NODE'
          'use strict';
          const {execFileSync} = require('node:child_process');
          const required = (name) => {
            const value = process.env[name];
            if (!value) throw Error(`Missing ${name}`);
            return value;
          };
          (async () => {
            const image = required('DOCKERHUB_REPOSITORY');
            if (image !== 'devanted/memonogi') throw Error('Invalid Docker Hub repository');
            const [namespace, repository] = image.split('/');
            const service = required('SERVICE_NAME');
            if (!['gateway', 'batch', 'community', 'auth'].includes(service)) throw Error('Invalid service name');
            const output = execFileSync('./gradlew', ['properties', '-q'], {encoding: 'utf8'});
            const matches = [...output.matchAll(/^version:\s*(.+)$/gm)];
            if (matches.length !== 1) throw Error('Cannot resolve root Gradle version');
            const version = matches[0][1].trim().replace(/-SNAPSHOT$/, '');
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) throw Error('Invalid Gradle version');
            const base = `https://hub.docker.com/v2/namespaces/${namespace}/repositories/${repository}`;
            const repositoryResponse = await fetch(base, {signal: AbortSignal.timeout(30000)});
            if (!repositoryResponse.ok) throw Error(`Docker Hub repository lookup failed (${repositoryResponse.status})`);
            const info = await repositoryResponse.json();
            if (info.is_private !== false) throw Error('Public Docker Hub repository required');
            const tag = `${service}-v${version}`;
            const tagResponse = await fetch(`${base}/tags/${tag}`, {signal: AbortSignal.timeout(30000)});
            if (tagResponse.status === 404) return;
            if (!tagResponse.ok) throw Error(`Docker Hub tag lookup failed (${tagResponse.status})`);
            throw Error(`${tag} already exists; increment the Gradle version before merging`);
          })().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
  auth-mysql:
    needs: validate
    if: inputs.service-profile == 'auth-mysql'
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0.42
        env:
          MYSQL_ROOT_PASSWORD: synthetic-nickname-test-only
          MYSQL_DATABASE: auth
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=synthetic-nickname-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
      token-migration-mysql:
        image: mysql:8.0.42
        env:
          MYSQL_ROOT_PASSWORD: synthetic-token-migration-only
          MYSQL_DATABASE: auth
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=synthetic-token-migration-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
      flyway-main-mysql:
        image: mysql:8.0.42
        env:
          MYSQL_ROOT_PASSWORD: synthetic-flyway-only
          MYSQL_DATABASE: devnogi
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=synthetic-flyway-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
      flyway-fresh-mysql:
        image: mysql:8.0.42
        env:
          MYSQL_ROOT_PASSWORD: synthetic-flyway-only
          MYSQL_DATABASE: auth
        ports:
          - 3309:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=synthetic-flyway-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew verify --no-daemon
      - name: Verify refresh token schema upgrade on isolated MySQL 8.0.42
        run: ./gradlew test --tests '*RefreshTokenMigrationMySqlTest' --rerun-tasks --no-daemon
        env:
          TOKEN_MIGRATION_MYSQL_URL: jdbc:mysql://127.0.0.1:3307/auth?useSSL=false&allowPublicKeyRetrieval=true
          TOKEN_MIGRATION_MYSQL_USER: root
          TOKEN_MIGRATION_MYSQL_PASSWORD: synthetic-token-migration-only
          TOKEN_MIGRATION_MYSQL_REQUIRED: 'true'
      - name: Verify exact main Flyway history and fresh auth baseline on isolated MySQL 8.0.42
        run: ./gradlew test --tests '*MainHistoryCompatibilityMySqlTest' --rerun-tasks --no-daemon
        env:
          FLYWAY_MAIN_MYSQL_URL: jdbc:mysql://127.0.0.1:3308/devnogi?useSSL=false&allowPublicKeyRetrieval=true
          FLYWAY_FRESH_MYSQL_URL: jdbc:mysql://127.0.0.1:3309/auth?useSSL=false&allowPublicKeyRetrieval=true
          FLYWAY_MYSQL_USER: root
          FLYWAY_MYSQL_PASSWORD: synthetic-flyway-only
          FLYWAY_MYSQL_REQUIRED: 'true'
      - name: Verify nickname migration on MySQL 8.0.42
        run: ./gradlew test --tests '*NicknameMigrationMySqlTest' --rerun-tasks --no-daemon
        env:
          NICKNAME_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/auth?useSSL=false&allowPublicKeyRetrieval=true
          NICKNAME_MYSQL_USER: root
          NICKNAME_MYSQL_PASSWORD: synthetic-nickname-test-only
          NICKNAME_MYSQL_REQUIRED: 'true'
      - name: Verify nickname and game identity concurrency on MySQL 8.0.42
        run: ./gradlew test --tests '*NicknameConcurrencyMySqlTest' --rerun-tasks --no-daemon
        env:
          NICKNAME_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/auth?useSSL=false&allowPublicKeyRetrieval=true
          NICKNAME_MYSQL_USER: root
          NICKNAME_MYSQL_PASSWORD: synthetic-nickname-test-only
          NICKNAME_MYSQL_REQUIRED: 'true'
      - name: Verify single-use game proof and token issuance races on MySQL 8.0.42
        run: ./gradlew test --tests '*UserVerificationConcurrencyMySqlTest' --rerun-tasks --no-daemon
        env:
          NICKNAME_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/auth?useSSL=false&allowPublicKeyRetrieval=true
          NICKNAME_MYSQL_USER: root
          NICKNAME_MYSQL_PASSWORD: synthetic-nickname-test-only
          NICKNAME_MYSQL_REQUIRED: 'true'
      - name: Verify OAuth exchange migration and one-time proof on MySQL 8.0.42
        run: ./gradlew test --tests '*OAuthExchangeMySqlTest' --tests '*SocialSignupProofMySqlTest' --rerun-tasks --no-daemon
        env:
          NICKNAME_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/auth?useSSL=false&allowPublicKeyRetrieval=true
          NICKNAME_MYSQL_USER: root
          NICKNAME_MYSQL_PASSWORD: synthetic-nickname-test-only
          NICKNAME_MYSQL_REQUIRED: 'true'
      - name: Verify refresh rotation and failure history on MySQL 8.0.42
        run: ./gradlew test --tests '*RefreshTokenRotationMySqlTest' --tests '*RefreshTokenLengthMySqlTest' --tests '*ConcurrentLoginMySqlTest' --tests '*UserVerificationFailureHistoryMySqlTest' --tests '*LoginLockoutMySqlTest' --rerun-tasks --no-daemon
        env:
          NICKNAME_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/auth?useSSL=false&allowPublicKeyRetrieval=true
          NICKNAME_MYSQL_USER: root
          NICKNAME_MYSQL_PASSWORD: synthetic-nickname-test-only
          NICKNAME_MYSQL_REQUIRED: 'true'
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auth-test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/jacoco/
          if-no-files-found: ignore
  verify:
    needs: validate
    if: inputs.service-profile == 'base' || inputs.service-profile == 'batch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew && ./gradlew verify --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-reports-${{ inputs.service-profile }}
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/jacoco/
          if-no-files-found: ignore
  community-redis:
    needs: validate
    if: inputs.service-profile == 'community-redis'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4.9
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew && ./gradlew verify --no-daemon
      - name: Redis integration
        if: inputs.service-profile == 'community-redis'
        run: ./gradlew redisIntegrationTest --no-daemon
        env:
          TEST_REDIS_HOST: 127.0.0.1
          TEST_REDIS_PORT: '6379'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/jacoco/
          if-no-files-found: ignore
  secret-scan:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/secret-scan.mjs
  container:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build image without pushing
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: docker build --file "$DOCKERFILE" --tag local/spring-ci:test .
      - name: Render production Compose with synthetic values
        env:
          COMPOSE_FILE: ${{ inputs.compose-file }}
        run: |
          test -f "$COMPOSE_FILE"
          mkdir -p "$RUNNER_TEMP/compose"
          cp "$COMPOSE_FILE" "$RUNNER_TEMP/compose/compose.yml"
          node -e 'const fs=require("fs"); const s=fs.readFileSync(process.env.COMPOSE_FILE,"utf8"); const names=[...s.matchAll(/\$\{([A-Za-z_][A-Za-z0-9_]*)/g)].map(x=>x[1]); const value=n=>n==="DEPLOY_ENV_FILE"?".env.prod":n.endsWith("PORT")?"8080":"synthetic"; fs.writeFileSync(process.env.RUNNER_TEMP+"/synthetic.env", [...new Set(names)].filter(n=>n!=="IMAGE_REF").map(n=>n+"="+value(n)).join("\n")+"\nIMAGE_REF=example/image@sha256:"+"a".repeat(64)+"\n")'
          cp "$RUNNER_TEMP/synthetic.env" "$RUNNER_TEMP/compose/.env.prod"
          docker compose --env-file "$RUNNER_TEMP/synthetic.env" -f "$RUNNER_TEMP/compose/compose.yml" config --quiet
