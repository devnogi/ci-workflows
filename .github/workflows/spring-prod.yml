          }
          
          function collision(versionDigest, shaDigest) {
            if (versionDigest === null && shaDigest === null) return 'build';
            if (versionDigest && shaDigest && versionDigest === shaDigest && /^sha256:[a-f0-9]{64}$/.test(versionDigest)) return 'reuse';
