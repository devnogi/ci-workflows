        run: ./gradlew test --tests '*RefreshTokenRotationMySqlTest' --tests '*RefreshTokenLengthMySqlTest' --tests '*ConcurrentLoginMySqlTest' --tests '*UserVerificationFailureHistoryMySqlTest' --tests '*LoginLockoutMySqlTest' --rerun-tasks --no-daemon
        env:
          NICKNAME_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/auth?useSSL=false&allowPublicKeyRetrieval=true
