          'use strict';
          const {execFileSync} = require('node:child_process');
          const required = (name) => {
            const value = process.env[name];
            if (!value || !/^[a-z0-9]+(?:[._-][a-z0-9]+)*$/.test(value)) throw Error(`Invalid ${name}`);
            return value;
          };
